},{"s":"11.6.1.6. Responsabilidades, Derechos y Deberes de los Padres y Madres de Familia","p":95,"t":"f. Responsabilidades frente a la Ley 1620/2013. Ley 1620/2013, Art. 22. Además de las obligaciones consagradas en el artículo 67 de la Constitución Política, en la Ley 115 de 1994, la Ley 1098 de 2006, la Ley 1453 de 2011 y demás normas vigentes, deberá: • Proveer a sus hijos espacios y ambientes en el hogar, que generen confianza, ternura, cuidado y protección de sí y de su entorno físico, social y ambiental. • Participar en la formulación, planeación y desarrollo de estrategias que promuevan la convivencia escolar, los derechos humanos, sexuales y reproductivos, la participación y la democracia, y el fomento de estilos de vida saludable. • Acompañar de forma permanente y activa a sus hijos en el proceso pedagógico que adelante el establecimiento educativo para la convivencia y la sexualidad. • Participar en la revisión y ajuste del manual de convivencia a través de las instancias de participación definidas en el proyecto educativo institucional del establecimiento educativo."},{"s":"11.6.1.6. Responsabilidades, Derechos y Deberes de los Padres y Madres de Familia","p":95,"t":"• Asumir responsabilidades en actividades para el aprovechamiento del tiempo libre de sus hijos para el desarrollo de competencias ciudadanas. • Cumplir con las condiciones y obligaciones establecidas en el manual de convivencia y responder cuando su hijo incumple alguna de las normas allí definidas. • Conocer y seguir la Ruta de Atención Integral cuando se presente un caso de violencia escolar, la vulneración de los derechos sexuales y reproductivos o una situación que lo amerite, de acuerdo con las instrucciones impartidas en el manual de convivencia del respectivo establecimiento educativo. • Utilizar los mecanismos legales existentes y los establecidos en la Ruta de Atención Integral a que se refiere esta ley, para restituir los derechos de sus hijos cuando estos sean agredidos. g. Responsabilidades frente al Decreto 1286/2005. Decreto 1286/2005. Art. 3 Con el fin de asegurar el cumplimiento de los compromisos adquiridos con la educación de sus hijos, corresponden a los padres y madres de familia:"},{"s":"11.6.1.6. Responsabilidades, Derechos y Deberes de los Padres y Madres de Familia","p":96,"t":"• Matricular oportunamente a sus hijos en establecimientos educativos debidamente reconocidos por el Estado y asegurar su permanencia durante su edad escolar obligatoria. • Contribuir para que el servicio educativo sea armónico con el ejercicio del derecho a la educación y en cumplimiento de sus fines sociales y legales. • Cumplir con las obligaciones contraídas en el acto de matrícula y en el manual de convivencia, para facilitar el proceso de educativo. • Contribuir en la construcción de un clima de respeto, tolerancia y responsabilidad mutua que favorezca la educación de los hijos y la mejor relación entre los miembros de la comunidad educativa. • Comunicar oportunamente, y en primer lugar a las autoridades del establecimiento educativo, las irregularidades de que tengan conocimiento, entre otras, en relación con el maltrato infantil, abuso sexual, tráfico o consumo de drogas ilícitas. En caso de no recibir pronta respuesta acudir a las autoridades competentes."},{"s":"11.6.1.6. Responsabilidades, Derechos y Deberes de los Padres y Madres de Familia","p":96,"t":"• Apoyar al establecimiento en el desarrollo de las acciones que conduzcan al mejoramiento del servicio educativo y que eleven la calidad de los aprendizajes, especialmente en la formulación y desarrollo de los planes de mejoramiento institucional. • Acompañar el proceso educativo en cumplimiento de su responsabilidad como primeros educadores de sus hijos, para mejorar la orientación personal y el desarrollo de valores ciudadanos. • Participar en el proceso de autoevaluación anual del establecimiento educativo. h. Responsabilidades frente al Decreto 1290/2009. Decreto 1290/2009. Art. 15. De conformidad con las normas vigentes, es responsabilidad de los padres de familia: • Participar, a través de las instancias del gobierno escolar, en la definición de criterios y procedimientosde la evaluación del aprendizaje de los estudiantes y promoción escolar • Realizar seguimiento permanente al proceso evaluativo de sus hijos"},{"s":"11.6.1.6. Responsabilidades, Derechos y Deberes de los Padres y Madres de Familia","p":96,"t":"• Analizar los informes periódicos de evaluación i. Derechos de los Padres y Madres de Familia Decreto 1290/2009. En el proceso formativo de sus hijos, los padres de familia tienen los siguientes derechos: • Conocer el sistema institucional de evaluación de los estudiantes: criterios, procedi mientos e instrumentos de evaluación y promoción desde el inicio de año escolar. • Acompañar el proceso evaluativo de los estudiantes. • Recibir los informes periódicos de evaluación. • Recibir oportunamente respuestas a las inquietudes y solicitudes presentadas sobr e el proceso de evaluación de sus hijos. Así mismo, los Padres y madres de familia de la Institución Educativa LICEO PAOLA tienen derecho a: • Pertenecer a la Asociación de padres de familia, con derecho a elegir y ser elegido, directivo de la misma. • Elegir y a ser elegido para formar parte del Consejo Directivo. • Expresar sus opiniones ante decisiones importantes del plantel, que influyan en la educación integral de los niños."},{"s":"11.6.1.6. Responsabilidades, Derechos y Deberes de los Padres y Madres de Familia","p":97,"t":"• Ser escuchado y ayudado por la dirección del plantel en caso de reclamos o necesidades. • Proponer iniciativas y sugerencias que estén de acuerdo con las normas vigentes y contribuyan a mejorar el funcionamiento del plantel. • Exigir idoneidad profesional en el profesorado. • Solicitar al departamento de Bienestar asesoría para sus hijos, cuando lo considere necesario. • Hacer reclamos justos, respetuosos y decorosos dentro del tiempo fijado por las normas legales e institucionales. • Tener permanentemente comunicación con los profesores de sus hijos, de manera que pueda estar al tanto de los logros o dificultades en el Aprendizaje de sus hijos; podrán ser atendidos por los profesores en el horario acordado con sus docentes. • Recibir el informe académico por periodos, siempre y cuando se halle al día con el pago de pensiones. • Colaborar y participar en el plan y desarrollo de las actividades programadas por el la Institución Educativa"},{"s":"11.6.1.6. Responsabilidades, Derechos y Deberes de los Padres y Madres de Familia","p":97,"t":"• Obtener información oportuna acerca del manual de convivencia y reglamento escolar del Establecimiento Educativo LICEO PAOLA. j.Deberes de los Padres y Madres de Familia Los Padres de familia de la Institución Educativa LICEO PAOLA se comprometen a cumplir con los siguientes deberes: • Cumplir con el horario escolar de sus hijos, teniendo en cuenta la puntualidad, el uniforme y la presentación personal de ellos. • Incentivar el amor y respeto por la Institución y todos sus estamentos velando siempre por el buen nombre del Colegio • Participar activamente en reuniones de padres, escuelas, asambleas y eventos programados por el Establecimiento y la Asopadres así como a las citaciones individuales. • Responder por el comportamiento de sus hijos dentro y fuera del colegio. • Comprometerse cuando se le solicite, activa y participativamente en el proceso terapéutico que el niño requiera, de modo que la Institución sirva de soporte y de puente entre el equipo interdisciplinario, el niño y la familia. El tratamiento del niño es responsabilidad de los padres."},{"s":"11.6.1.6. Responsabilidades, Derechos y Deberes de los Padres y Madres de Familia","p":98,"t":"• Considerar a los docentes como guías y orientadores del proceso de formación, guardándoles respeto y la confianza que se merecen. • Proporcionarle en casa la atención y el cuidado necesario cuando el niño se encuentre enfermo y no enviarlo al Colegio por su bienestar y precaución. • No enviar a los niños con joyas, juguetes u otros objetos a menos que sean requeridos por el docente. • Respetar al personal docente y demás empleados del Colegio, al igual que las decisiones de los Directivos y las normativas ya establecidas como currículo, horario, uniformes, pedagogía etc. • Avisar y autorizar a la docente de disciplina y/o la coordinadora cuando personas diferentes a los padres recojan a los niños en el colegio. • Responder de inmediato por los daños que ocasionen sus hijos en el colegio. • En los casos de la no asistencia del estudiante a la Institución, y tener el derecho a recuperar las notas que se generen durante su ausencia, deben:"},{"s":"11.6.1.6. Responsabilidades, Derechos y Deberes de los Padres y Madres de Familia","p":98,"t":"• Notificarlo al colegio por medio escrito con anticipación para evitar que se le generen malas notas por no presentar sus obligaciones escolares durante su asistencia. • Al momento de regresar a clases debe estar al día en las labores realizadas durante su ausencia para ser revisadas por todos y cada uno de los docentes. • Los padres o acudientes son los responsables de ponerlos al día durante su ausencia. No es responsabilidad de los docentes dicha labor, ni adelantarlos, ni entregar anticipadamente trabajos, ni tareas que se realizaran durante la ausencia. • Asistir a las reuniones programadas por la institución y a las citaciones que sean necesarias para el conocimiento del desempeño y formación de sus hijos, recordando que “la ausencia reiterada de los padres a las citaciones que hace el colegio, en este caso la institución los reportará a las autoridades competentes como ICBF, Policía de Infancia y Adolescencia, o cualquier otra entidad que deba conocer de estos casos” como lo contempla la normatividad vigente en el país."},{"s":"11.6.1.7. Responsabilidades, derechos y responsabilidades de los Estudiantes de la","p":99,"t":"Institución b. De las responsabilidades de los estudiantes La Constitución Política de Colombia, Art. 67, considera que, el derecho a la educación, es un “derecho – deber”, que da derecho y exige obligaciones a todos los participantes del proceso educativo. Entre los deberes fundamentales de los estudiantes están: • Asumir las normas de convivencia social. • Demostrar un rendimiento académico acorde con las exigencias Institucionales. • Cumplir con todo lo reglamentado en el Manual de convivencia Institucional. El incumplimiento de estos deberes permite al colegio adoptar las medidas pertinentes, teniendo en cuenta el debido proceso. El derecho a la educación no se vulnera si la institución establece normas de rendimiento académico y actúa de conformidad con ellas. Los alumnos y alumnas del establecimiento, deben adoptar un comportamiento de acuerdo con el Perfil del estudiante establecido en el Proyecto Educativo que ofrece la institución PEI y las orientaciones propuestas en el manual de Convivencia Escolar."},{"s":"11.6.1.7. Responsabilidades, derechos y responsabilidades de los Estudiantes de la","p":99,"t":"c. Derechos de los estudiantes Decreto 1290/2009. Art. 12. El estudiante, para el mejor desarrollo de su proceso formativo tiene derecho a: • Ser evaluado de manera integral en todos los aspectos académicos, personales y sociales • Conocer el sistema institucional de evaluación de los estudiantes: criterios, procedimientos e instrumentos de evaluación y promoción desde el inicio de año escolar • Conocer los resultados de los procesos de evaluación y recibir oportunamente las respuestas a las inquietudes y solicitudes presentadas respecto a estas. • Recibir la asesoría y acompañamiento de los docentes para superar sus debilidades en el aprendizaje. También son derechos de los estudiantes • Son derechos fundamentales: la vida, la integridad física, la salud, la educación, la recreación y la libre expresión de opinión (Art. 44 Constitución Nacional). • Organizar y participar en actividades curriculares y extraescolares con el acompañamiento de las directivas y el permiso de padres y/o acudientes."},{"s":"11.6.1.7. Responsabilidades, derechos y responsabilidades de los Estudiantes de la","p":100,"t":"• Participar, elegir y ser elegido como miembro del gobierno escolar y otros comités reconocidos por la Institución Educativa (art. 142 ley general de la educación). • Ser representado y asistido por sus padres y/o acudiente en cualquier situación • Representar a la Institución en los diferentes encuentros de acuerdo con el perfil requerido. • Utilizar los servicios y espacios físicos ofrecidos por la Institución para el desarrollo integral. • Ser respetado en su dignidad personal, sin ningún tipo de discriminación por razones de sexo, raza, religión, idioma, aspecto físico, posición social o económica (Art. 44 código de Infancia y adolescencia). • Recibir oportuna y adecuadamente la información solicitada, la aclaración o la corrección sobre la situación académica y disciplinaria. • Al debido proceso y agotar las instancias establecidas en el conducto regular. • A que los directivos y educadores sean equilibrados y justos, respeten el ritmo personal y la individualidad, fijen pautas de trabajo claro, las comuniquen oportunamente, las cumplan y las hagan cumplir; a que no empleen la amenaza, ni trato que implique de alguna manera afectar los derechos fundamentales (Art. 45 código de infancia y adolescencia)."},{"s":"11.6.1.7. Responsabilidades, derechos y responsabilidades de los Estudiantes de la","p":100,"t":"• Presentar evaluaciones, trabajos o tareas que no se hayan ejecutado en la fecha indicada, con excusa justificada ante la Coordinadora académica (o ante quien ésta haya delegado está función). • Ser evaluado en forma integral, oportuna y permanente con justicia, claridad, respeto y objetividad de acuerdo con la legislación emanada por el MEN. • Expresar, discutir y examinar con libertad: doctrinas, opiniones o conocimientos, dentro del debido respeto a la opinión ajena y a la cátedra mediante el procedimiento de reglas de debate y petición (art. 20 Constitución Nacional). • A solicitar y recibir orientación y acompañamiento de directivos y profesores sobre aspectos relacionados con su formación integral. • Recibir estímulos académicos y formativos cuando se haga merecedor a ellos. • Conocer el Manual de Convivencia, la Hoja de Vida y los registros que se hagan en el Observador del estudiante."},{"s":"11.6.1.7. Responsabilidades, derechos y responsabilidades de los Estudiantes de la","p":100,"t":"d. Deberes de los estudiantes Con el objetivo de establecer y mantener canales de respeto entre los miembros de la Comunidad, se deberán observar y guiar las relaciones entre estudiantes y profesores de acuerdo con los siguientes criterios, por tanto los estudiantes deberán prestar atención permanentemente en clase y a sus docentes en las orientaciones y actividades que se propongan, así como también, mantener trato respetuoso y cordial con la comunidad Educativa (profesores/as, directivas, estudiantes, padres y madres de familia y empleados). Decreto 1290/2009. Art. 13. El estudiante, para el mejor desarrollo de su proceso formativo, debe: • Cumplir con los compromisos académicos y de convivencia definidos por el e stablecimiento educativo. • Cumplir con las recomendaciones y compromisos adquiridos para la superación de sus debilidades. También son deberes de los estudiantes • Cumplir con los lineamientos establecidos en el manual de convivencia y trabajar permanentemente en su interiorización."},{"s":"11.6.1.7. Responsabilidades, derechos y responsabilidades de los Estudiantes de la","p":101,"t":"• Respetar y hacer respetar el buen nombre de la institución dentro y fuera de él (porten • no el uniforme). • No traer ni portar accesorios distintos de los autorizados como uniforme de la institución (piercing, collares, camisetas y zapatos de otro color) ni artículos de valor como celulares, joyas, entre otros). • Cuidar y respetar el entorno ecológico, la planta física y todos los implementos de la Institución, colaborando, además, con el orden, el aseo y la decoración del Colegio. • Prepararse y responder por su formación integral en los tiempos establecidos por la Institución. • Cumplir el conducto regular y respetar las condiciones con el debido proceso. • Dar un trato justo, oportuno y respetuoso a cada uno de los miembros de la comunidad educativa, no agredir física, verbal, ni virtualmente a los demás. • Respetar las organizaciones democráticas del gobierno escolar, cumpliendo los compromisos y acuerdos de éstos."},{"s":"11.6.1.7. Responsabilidades, derechos y responsabilidades de los Estudiantes de la","p":101,"t":"• Informar a su representante (padres y/ o acudiente) sobre los llamados y requerimientos que haga la institución. • Gestionar y participar en las actividades, encaminadas a mejorar la calidad en los procesos académicos. • No portar armas corto punzante, ni traer láminas o revistas pornográficas, radios, explosivos, juguetes o bromas que representen riesgos a la comunidad educativa. • No deben traer ni utilizar celulares al interior de la institución, si se presentara cualquier emergencia los padres o acudientes se pueden comunicar con la institución • Cumplir con el horario y ser puntual en la llegada a clases y a todos los actos programados o en los que la institución participe, y sea obligatoria su participación. • Asistir a clases, así como a los actos curriculares y a todos los eventos en que la institución participe, con su uniforme completo, definido por la institución para la ocasión. • Justificar personalmente por escrito y con la presencia de sus padres o acudiente, toda ausencia o inasistencia a clase o a cualquier acto programado por la institución, máximo tres (3) días después de reincorporarse a clases. La falta de cumplimiento de esta norma dentro de los plazos establecidos, ameritará la repetición de un grado para"},{"s":"11.6.1.7. Responsabilidades, derechos y responsabilidades de los Estudiantes de la","p":102,"t":"el educando que haya dejado de asistir injustificadamente a más del 25% de las actividades académicas durante el año escolar • Cuando un estudiante se ausenta del colegio sea cual fuere a razón, deberá estar al día en cuaderno, trabajos, tareas, talleres etc. y estar preparado para realizar las evaluaciones en el momento que se reintegra al colegio para que pueda recuperar notas, de lo contrario no tendrá la oportunidad de recuperarlas. Las faltas se suman de igual manera justificadas o no y sobrepasar el 25% de ausencias en el año se considera causa de reprobación. • Asistir a los desfiles y actos extracurriculares de la institución, los cuales son de carácter obligatorio, exceptuando su participación por justificación médica o razones de índole mayor debidamente comprobada. • Llevar con respeto y pulcritud el uniforme esforzándose por su excelente presentación personal en todos los eventos escolares, sin maquillajes, sin alhajas, con las uñas cortas, limpias y sin esmalte."},{"s":"11.6.1.7. Responsabilidades, derechos y responsabilidades de los Estudiantes de la","p":102,"t":"• Respetar y cumplir el reglamento de uso del uniforme, así: • Los uniformes deben sujetarse al modelo y material indicado por la Institución Educativa LICEO PAOLA. • El uniforme del plantel Educativo se debe usar desde el primer día de clases hasta el último día de clases incluyendo zapatos y tenis reglamentarios. • El uniforme del Plantel Educativo, se usará fuera de la Institución únicamente actividades programadas por el colegio. • El uniforme del Plantel Educativo, se usará de acuerdo a las exigencias del colegio y no se podrá usar roto, manchado o decolorado bajo ninguna circunstancia de lo contrario se impedirá la entrada al colegio. • El uniforme del Plantel Educativo, se usará de acuerdo al horario, sea educación Física o diario y no se permitirá la entrada al colegio si se incumple el horario de uso. • El uniforme del Plantel Educativo, no se podrá usar en dramatizaciones, bailes • actividades recreativas como parte de la vestimenta para dichas actividades."},{"s":"11.6.1.7. Responsabilidades, derechos y responsabilidades de los Estudiantes de la","p":102,"t":"• El uniforme del Plantel Educativo, se usará de acuerdo a la siguiente descripción:"},{"s":"12. OTRAS NORMAS DE COMPORTAMIENTO EN ESPACIOS ESCOLARES","p":102,"t":"La institución establece la reglamentación para el uso de equipos electrónicos como celulares, computadores portátiles, dispositivos musicales, tablets, etc. La reglamentación rige para todos los estudiantes de la Institución Educativa. • Los teléfonos celulares deberán estar apagados en todo momento durante el desarrollo de las actividades escolares. • En caso de alguna emergencia familiar se deberá utilizar las líneas telefónicas de la institución o en última instancia informar al coordinador o docente de cualquier situación que requiera del uso del celular. • El estudiante podrá hacer uso del celular a la hora de salida, finalizada la jornada escolar. • El estudiante podrá hacer uso del celular en las salidas pedagógicas, recreativas u otras actividades que se desarrollen fuera del Colegio, previa autorización para ello. • Otros aparatos electrónicos podrán ser utilizados para uso académico únicamente con la autorización y bajo la supervisión de un docente responsable."},{"s":"12. OTRAS NORMAS DE COMPORTAMIENTO EN ESPACIOS ESCOLARES","p":103,"t":"• Los alumnos tienen el deber de velar por el cuidado de los equipos electrónicos y teléfonos celulares de su propiedad. El colegio y personal docente no se hacen responsables por daños y/o pérdidas de los mismos. • Los estudiantes que no cumplan con la reglamentación anterior, se someterán a que sus equipos electrónicos o teléfonos celulares les sean retenidos hasta el siguiente mes o hasta el momento en que las directivas lo determinen teniendo en cuentas las reincidencias. Sus padres deberán recibir el celular y firmar los compromisos con el Colegio. • Se registrará en el observador de clase las conductas irregulares, para el respectivo seguimiento, evitando conductas reiteradas con otros profesores y/u otras clases. • Si un estudiante reincide en el desacato a estas reglas, se procederá conforme a lo establecidos en el presente manual. • Hacer buen uso de los sanitarios Cuidado del ambiente y los recursos naturales que se encuentran en el establecimiento"},{"s":"13. REGLAMENTACIÓN SOBRE LA ASIGNATURA DE DISCIPLINA","p":103,"t":"Fundamento normativo: • Ley 1620 de 2013 – Por la cual se crea el Sistema Nacional de Convivencia Escolar y Formación para el Ejercicio de los Derechos Humanos, la Educación para la Sexualidad y la Prevención y Mitigación de la Violencia Escolar. • Decreto 1965 de 2013 – Reglamenta la Ley 1620 y establece lineamientos para los manuales de convivencia y comités escolares de convivencia. • Código de Infancia y Adolescencia (Ley 1098 de 2006) – Garantiza el derecho a la educación integral en un ambiente respetuoso."},{"s":"13.1. Pérdida de la Asignatura de Disciplina","p":103,"t":"Un estudiante podrá perder la asignatura de Disciplina cuando: 1. Incumpla reiteradamente las normas establecidas en el Manual de Convivencia, a pesar de haber recibido llamados de atención y orientaciones previas. 2. Presente acumulación de faltas leves o la comisión de faltas graves que evidencien irrespeto, agresión, desobediencia o incumplimiento de deberes. 3. No cumpla con los compromisos adquiridos en los acuerdos de mejoramiento, firmados con el Comité de Convivencia, Coordinación de Disciplina y Padres de Familia. 4. Mantenga una conducta negativa que afecte la sana convivencia escolar, según seguimiento de observadores de convivencia y reportes docentes."},{"s":"13.2. Proceso de Suspensión Temporal (Medida Correctiva)","p":104,"t":"Antes de perder definitivamente la asignatura, se aplicará un proceso gradual: • Primer nivel: Llamado de atención verbal y registro en observador. • Segundo nivel: Llamado de atención escrito y citación a padres. • Tercer nivel: Compromiso de mejoramiento firmado por estudiante y acudiente. • Cuarto nivel: Suspensión temporal (de 1 a 5 días), con actividades pedagógicas obligatorias orientadas por el Comité de Convivencia. • Quinto nivel: En caso de reincidencia y agotamiento del proceso, pérdida de la asignatura de Disciplina, informada formalmente a los padres de familia y registrada en boletín académico."},{"s":"13.3. Medidas de Recuperación","p":104,"t":"Con el fin de garantizar el derecho a la educación y la formación integral, el estudiante tendrá una única oportunidad de recuperación, que consistirá en: 1. Cumplimiento del Plan de Mejora: Diseñado por el docente orientador o coordinador de disciplina, que incluirá actividades como: • Talleres de reflexión sobre convivencia, respeto y autocontrol. • Lecturas y ensayos sobre normas y valores institucionales. • Participación en actividades de servicio social dentro del colegio. 2. Asistencia obligatoria a sesiones de orientación (individuales o grupales). 3. Seguimiento semanal por parte del Comité de Convivencia, para evaluar cambios en comportamiento. 4. Cumplimiento del 100% de compromisos adquiridos en el plan, certificado por el docente responsable. Si al finalizar el periodo establecido (ej. un mes) el estudiante demuestra cambio positivo y cumple las actividades, podrá recuperar la asignatura de Disciplina."},{"s":"13.4. Medidas Institucionales de Acompañamiento","p":104,"t":"El colegio, como corresponsable en la formación integral del estudiante, aplicará: • Escuelas de Padres orientadas a la formación en valores y disciplina. • Talleres de mediación escolar para fortalecer la resolución pacífica de conflictos. • Programas de refuerzo socioemocional con apoyo del orientador escolar. • Reportes periódicos a padres sobre avances y compromisos cumplidos."},{"s":"14. UNIFORMES ESCOLARES","p":105,"t":"Uniformes de las Niñas Uniformes de los Niños Uniforme de Educación Física • Recordar y cumplir con el horario escolar establecido para el nivel que cursa: Niveles y grados Hora de entrada Hora de salida Maternal y Caminadores 6:55 A.M 12:00 M Pre jardín, Jardín y 6:55 A.M 12:30 P.M Transición Primaria 6:55 A.M 1:15 P.M Básica Secundaria y 1:45 P.M 6:55 A.M Media • Del Sistema de Reconocimiento y Estímulo a los estudiantes Los siguientes son estímulos diseñados por el plantel para motivar a sus estudiantes: ▪ Izar la bandera nacional en acto cívico. ▪ Felicitaciones verbales y escritas. ▪ Reconocimiento en el cuadro de honor. ▪ Otorgamiento de mención de honor. A final de año se otorgarán las siguientes menciones:"},{"s":"14. UNIFORMES ESCOLARES","p":107,"t":"▪ Excelencia por nivel: Se le otorgará mención a la excelencia a los estudiantes que alcancen el promedio establecido para nivel de desempeño superior (rango de 4,76 a 5,00). Para aquellos estudiantes que no asisten a los eventos obligatorios extracurriculares o hayan tenido un proceso disciplinario perderán el derecho a la excelencia los estudiantes aunque hayan alcanzado el promedio requerido (éste será un criterio para dirimir empates). ▪ Conducta o disciplina: otorgado a los estudiantes que durante el año escolar no presentaron ningún inconveniente disciplinario, cumpliendo con todas las normas establecidas en el manual de convivencia. ▪ Compañerismo: otorgado a los estudiantes que se destacaron por su sentido de pertenencia y tolerancia hacia sus compañeros y cuerpo docente. ▪ Colaboración: ▪ Premios a los tres mejores estudiantes: Se otorgan los puestos a los estudiantes que obtengan los tres mejores promedios del curso por encima de 4.0; los estudiantes que obtengan un promedio por debajo de 4.0 no recibirán mención. ▪ Menciones: la mención al esfuerzo se otorga a un estudiante que pese a sus dificultades logra las metas propuestas. Esta se decide en consejo académico. Se define como dificultades:"},{"s":"14. UNIFORMES ESCOLARES","p":107,"t":"✓ Problemas de Aprendizaje (Diagnosticados y bajo tratamiento terapéutico). ✓ Problemas Conductuales asociados a diagnóstico previo. ✓ Problemas Emocionales situaciones que afectan su estabilidad emocional. Nota: La mención al esfuerzo se otorgará cuando el estudiante refleja su esfuerzo en el contexto general escolar y no en asignaturas específicas. ▪ Grados Transición y Quinto: Se otorga menciones especiales a todos los graduandos de los grados Transición y Quinto, teniendo en cuenta el desarrollo de las actitudes evidenciadas en la Misión y Visión de la Institución, son sus docentes los que tienen a potestad para otorgarlas. ▪ Premiación para los graduandos del grado 11º: ✓ Diploma por haber culminado el grado 11º. ✓ Liderazgo (al estudiante que se halla destacado por su liderazgo dentro y fuera de su salón de clases). ✓ Mejor resultado pruebas Saber 11º del colegio. ✓ Primer puesto pruebas Saber 11º en el departamento. ✓ Perseverancia y constancia (estudiantes que han estudiado en la institución desde preescolar)."},{"s":"14. UNIFORMES ESCOLARES","p":108,"t":"✓ Mejor bachiller (estudiante que obtuvo el promedio más alto durante la secundaria). ✓ Deportista (en el caso que lo hubiere, se le otorga al estudiante que ha tenido un resultado alto en competencias deportivas a nivel departamental o nacional). ▪ Máxima excelencia académica: El premio Máxima Excelencia se le otorga al estudiante con mayor rendimiento en su desempeño académico integral escogido entre los estudiantes que obtuvieron la mención a la excelencia de todos los grados de la Institución y se hará acreedor a una beca de estudios. En caso de haber empate, la beca será divida en partes iguales. Los estudiantes del grado 11° pueden recibir el honor pero no participan en el concurso por la beca. ✓ Se otorga al estudiante que obtenga el promedio más alto entre los estudiantes con excelencia. ✓ Que no haya presentado ningún comportamiento indebido que se clasifique como falta al Manual de convivencia ✓ Que durante el año lectivo no hayan obtenido ninguna calificación en bajo."},{"s":"14. UNIFORMES ESCOLARES","p":108,"t":"• Ddifusión del Manual de Convivencia El presente Manual se dará a conocer anualmente a toda la comunidad educativa. A los padres, madres, acudientes o representantes legales, mediante reunión general de socialización programada según el Cronograma Académico y a los docentes durante la semana de planeación escolar. Se realizarán jornadas de divulgación con los estudiantes en las horas de asesorías académicas de las dos primeras semanas del año escolar. En las reuniones del Consejo de Padres se llevarán a cabo talleres de difusión, mediante los correos electrónicos, en físico por medio de la agenda escolar, para que toda la comunidad participe de la vivencia del presente Manual."}]</script>
