mo de las acciones, medidas recomendaciones, conceptos adoptados y sentido de las votaciones. • Firma de cada uno de los miembros, una vez haya sido aprobada por los asistentes. e. De las acciones y decisiones del Comité Escolar de Convivencia. Para dar cumplimiento al Art. 26, del Decreto 1965. El comité escolar de convivencia, en el ámbito de sus competencias, desarrollará acciones para la promoción y fortalecimiento de la formación para la ciudadanía y el ejercicio de los derechos humanos, sexuales y reproductivos; para la prevención y mitigación de la violencia escolar y el embarazo en la adolescencia; y para la atención de las situaciones que afectan la convivencia escolar y el ejercicio de los derechos humanos, sexuales y reproductivos a partir de la implementación, desarrollo y aplicación de las estrategias y programas trazados por el Comité Nacional de Convivencia Escolar y por el respectivo comité municipal, distrital o departamental de convivencia escolar, dentro del respeto absoluto de la Constitución y la ley."},{"s":"11.2.4. Operatividad del Comité Escolar de Convivencia","p":65,"t":"f. De los conflictos de intereses y causales de impedimento y recusación de los miembros del Comité Escolar de Convivencia. El Art. 27 del Decreto 1965/2013 determina que “tratándose de los establecimientos educativos no oficiales, los respectivos reglamentos de los comités escolares de convivencia deberán definir los conflictos de interés, las causales de impedimento y de recusación así como el procedimiento para resolverlos, de tal forma que se garantice la imparcialidad de los integrantes de los referidos comités”. Por tanto, se considerarán conflicto de interés, causal de impedimento y recusación de los miembros del Comité Escolar de Convivencia de la Institución Educativa LICEO PAOLA, aquellos casos en los que: • Existan grados de consanguinidad hasta el cuarto nivel, de familiaridad o afinidad entre los integrantes del comité y el o los involucrados en el caso a analizar; el o los miembros que estén en esta condición deberán abstenerse de actuar u opinar, poniendo en conocimiento del comité la causal de conflicto, impedimento o recusación para ser consignado en el acta, por lo que los restantes miembros deberán tomar las decisiones que consideren pertinentes."},{"s":"11.2.4. Operatividad del Comité Escolar de Convivencia","p":66,"t":"• Es un integrante del comité de convivencia escolar quien está involucrado o hace parte del caso a solucionar; este miembro, automáticamente y por razones obvias, estará inhabilitado para este caso en particular, por lo que los restantes miembros deberán tomar las decisiones que consideren pertinentes para solucionar el conflicto. • Otras en las que sus miembros consideren, en un determinado momento, y que necesite ser determinada como tal se deberá someter a votación y se tomará como aceptada cuando exista mayoría simple; el miembro del comité escolar de convivencia recusado no podrá actuar en el caso objeto de análisis, con lo cual los restantes miembros deberán tomar las decisiones que consideren pertinentes para solucionar el conflicto"},{"s":"11.2.5. Reglamento del Comité Escolar de Convivencia","p":66,"t":"De acuerdo con el parágrafo del Art. 13 de la Ley 1620/2013, se estructura el reglamento del Comité Escolar de Convivencia: a. El período de los miembros del Comité Escolar de Convivencia será de un (1) año, contados desde la fecha de la comunicación de la elección y/o designación, hasta cuando la conformación del nuevo comité de convivencia escolar; se podrán reelegir sus miembros hasta por un periodo adicional. b. Reunirse de manera ordinaria cada dos meses, contados a partir de la iniciación de clases de los estudiantes. c. Hacer seguimiento a los compromisos adquiridos por las partes involucradas en la situación acontecida, verificando el cumplimiento de lo estipulado por el Comité. d. Siempre que un miembro del Comité de Convivencia Escolar considere que existe algún factor que impida su actuación con la autonomía e imparcialidad necesaria, deberá manifestarlo a los demás miembros, para que éstos se pronuncien al respecto."},{"s":"11.2.5. Reglamento del Comité Escolar de Convivencia","p":66,"t":"e. La persona que presenta la queja o cualquier miembro del Comité también podrá recusar, con razones válidas, expresando los motivos que a su juicio afecten la autonomía o la imparcialidad de alguno de los miembros del Comité para actuar en un caso concreto, lo que deberá quedar consignado en el acta. f. En caso de que la inhabilidad o la recusación sean aceptadas por el resto de los miembros del Comité, el integrante quedará inhabilitado para participar en el caso concreto y el Comité dará curso al proceso con los miembros restantes, siempre y cuando haya quorum decisorio. g. Aprobación del reglamento de funcionamiento del Comité. h. Los demás temas que los miembros quieran tratar. i. Son obligaciones de los miembros del comité: • Asistir puntualmente a las reuniones programadas. • Mantener bajo estricta confidencialidad la información que conozcan en ejercicio de sus funciones. • Contribuir al logro de los consensos necesarios para las decisiones del Comité."},{"s":"11.2.5. Reglamento del Comité Escolar de Convivencia","p":67,"t":"• Llevar a cabo las tareas encomendadas por el Comité. j. Son causales de retiro de los miembros del comité: • La desvinculación como miembro de la comunidad educativa de la Institución • Haber violado el deber de confidencialidad como miembro del Comité de Convivencia Escolar. • Faltar a más de tres (3) reuniones consecutivas del Comité de Convivencia Escolar. • Incumplir en forma reiterada las otras obligaciones que le corresponden como miembro del Comité. • La renuncia voluntaria como miembro del Comité de Convivencia Escolar. ▪ Nota: La decisión de retiro en los casos 2, 3, 4 y 5 debe ser adoptada e informada por el resto de miembros del Comité y consignada en acta y escoger el nuevo miembro que tendrá la representatividad del estamento al que pertenece el miembro desvinculado. k. Son funciones del rector (a), como presidente del comité de convivencia escolar: • Convocar a los miembros del Comité a las sesiones ordinarias y extraordinarias."},{"s":"11.2.5. Reglamento del Comité Escolar de Convivencia","p":67,"t":"• Presidir y orientar las reuniones ordinarias y extraordinarias. • Presentar y tramitar ante el comité las recomendaciones para el mejor funcionamiento del comité escolar de convivencia. • Gestionar los recursos requeridos para el funcionamiento del Comité. • Dar trámite a las quejas presentadas, las cuales deberá recibir y presentar por escrito, en las que se describan las situaciones que puedan ser constitutivas de acoso laboral y afectar el clima laboral, así como las pruebas que las soportan. • Enviar por medio físico o electrónico a los miembros del Comité de Convivencia Escolar la convocatoria a las sesiones ordinarias y extraordinarias, indicando el día, la hora y el lugar de la reunión. • Citar individualmente a cada una de las partes involucradas en las quejas, con el fin de escuchar los hechos que dieron lugar a la misma, de manera discrecional, cuando lo considere necesario. • Citar a los involucrados en las quejas con el fin de establecer compromisos de convivencia."},{"s":"11.2.5. Reglamento del Comité Escolar de Convivencia","p":68,"t":"• Llevar el archivo de las quejas presentadas, la documentación soporte y velar por la reserva, custodia y confidencialidad de la información, o designar a quien considere para este fin. • Elaborar el orden del día y las actas de cada una de las sesiones del Comité de Convivencia Escolar. • Enviar las comunicaciones con las recomendaciones dadas por el Comité de Convivencia Escolar a las diferentes dependencias involucradas en la situación particular, en especial en aquellos casos que contemplan entidades del Sistema Nacional de Convivencia Escolar y Formación para los Derechos Humanos, la Educación para la Sexualidad y la Prevención y Mitigación de la Violencia Escolar. • Citar a reuniones y solicitar los soportes requeridos para hacer seguimiento al cumplimiento de los compromisos adquiridos por cada una de las partes involucradas. • Autorizar al rector (a) (o a quien ella designe), para que en nombre de todos los miembros conozca, documente y de solución de manera personal a las situaciones Tipo I, II o III definidas en el presente manual y lo contemplado en las normas vigentes."},{"s":"11.2.5. Reglamento del Comité Escolar de Convivencia","p":68,"t":"• Elaborar informes sobre la gestión del Comité que incluyan estadísticas de las quejas, seguimiento de los casos, recomendaciones y propuestas, los cuales deberán estar a disposición de los miembros de la comunidad y las autoridades competentes, salvo en casos que pueda vulnerar la confidencialidad o el buen nombre de uno de los involucrados o de la institución."},{"s":"11.2.6. Recepción, Conocimiento y Tratamiento de Situaciones","p":68,"t":"Las situaciones que atenten contra el manual de convivencia escolar o lo dispuesto en el Sistema Nacional de Convivencia Escolar y Formación para los Derechos Humanos, la Educación para la Sexualidad y la Prevención y Mitigación de la Violencia Escolar, al tenor de la Ley 1620/2013 y el Decreto 1965/2013, podrán ser recibidas: a. Por cualquier miembro de la institución, quién deberá canalizarla hasta el rector (a) (o a quien ella haya delegado esta función) para ser documentada y puesta a consideración del Comité de Convivencia Escolar. b. De manera escrita (medio físico), verbal (que se deberá documentar), a través de los correos electrónicos institucionales liceopaola@hotmail.com o coordinacionliceopaola@gmail.commailto:colegio@hotail.com, la página web institucional, el correo electrónico de cualquier miembro de la institución, o por cualquier otro medio desarrollado por la institución o por los miembros del Comité Escolar de Convivencia o el rector como autoridad competente para imponer los correctivos contemplados en el presente manual de Convivencias escolar."},{"s":"11.3.1. Protocolos para la atención integral","p":69,"t":"El Art. 41 del Decreto 1965/2013 define que los protocolos son orientaciones o procedimientos necesarios para asistir oportunamente a la comunidad educativa frente a las situaciones que afectan la convivencia escolar y el ejercicio de los derechos humanos, sexuales y reproductivos, en los cuales deben incluirse aspectos básicos como: 1. La forma de iniciación, recepción y radicación de las quejas o informaciones sobre situaciones que afectan la convivencia escolar y el ejercicio de los derechos humanos, sexuales y reproductivos. 2. Las estrategias y alternativas de solución, incluyendo entre ellas los mecanismos pedagógicos para tomar estas situaciones como oportunidades para el aprendizaje y la práctica de competencias ciudadanas de la comunidad educativa. 3. Las consecuencias aplicables, las cuales deben obedecer al principio de proporcionalidad entre la situación y las medidas adoptadas, y deben estar en concordancia con la Constitución, los tratados internacionales, la ley y los manuales de convivencia."},{"s":"11.3.1. Protocolos para la atención integral","p":69,"t":"4. Los mecanismos mediante los cuales se proteja a quien informe sobre la ocurrencia de situaciones que afecten la convivencia escolar y el ejercicio de los derechos humanos, sexuales y reproductivos, de posibles acciones en su contra. 5. Las formas de seguimiento de los casos y de las medidas adoptadas, a fin de verificar si la solución fue efectiva. 6. Un directorio que contenga los números telefónicos actualizados de las siguientes entidades y personas: Policía Nacional, del responsable de seguridad de la Secretaría de Gobierno municipal, distrital o departamental, Fiscalía General de la Nación Unidad de Infancia y Adolescencia, Policía de Infancia y Adolescencia, Defensoría de Familia, Comisaría de Familia, Inspector de Policía, ICBF – Instituto Colombiano de Bienestar Familiar, del puesto de salud u Hospital más cercano, Bomberos, Cruz Roja, Defensa Civil, Medicina Legal, de las entidades que integran el Sistema Nacional de Convivencia Escolar, de los padres de familia o acudientes de los niños, niñas y adolescentes matriculados en el establecimiento educativo."},{"s":"11.3.1. Protocolos para la atención integral","p":69,"t":"7. Los mecanismos para garantizar el derecho a la intimidad y a la confidencialidad de los documentos en medio físico o electrónico, así como de las informaciones suministradas por las personas que intervengan en las actuaciones y de toda la información que se genere dentro de las mismas, en los términos establecidos en la Constitución Política, los tratados internacionales, en la Ley 1098 de 2006, en la Ley estatutaria 1581 de 2012, en el Decreto 1377 de 2013 y demás normas aplicables a la materia."},{"s":"11.3.2. Sanciones y el debido proceso","p":70,"t":"Para garantizar el debido proceso, el comité escolar de convivencia tendrá en cuenta o podrá recomendar las siguientes acciones y sanciones disciplinarias, las cuales podrá aplicar de acuerdo con los criterios de equidad, justicia y transparencia, las cuales deberán estar ajustadas y a la medida con la situación presentada. La aplicación de las sanciones se hará de manera discrecional y ajustada en derecho. Entre las acciones y/o sanciones a aplicar se encuentran: • Llamados de atención, de manera verbal • Llamados de atención escrito, con copia a la hoja de vida de los implicados. • Citación a padres de familia. • Charlas con la psicóloga. • Firma de compromiso académico – disciplinario. • Suspensión de uno (1) a tres (3) días hábiles de clases. Según lo determine • Suspensión temporal de los derechos de asistir a clases, de dos o más días según decisión del comité escolar de convivencia. • Aplicación de matrícula condicional."},{"s":"11.3.2. Sanciones y el debido proceso","p":70,"t":"• Desdolarización por lo que resta del año lectivo (cancelación de matrícula) • Expulsión de la Institución, lo que conlleva el retiro del estudiante de la misma. • Recomendación de cambio de institución. • Cuestionamiento y negación del cupo escolar para el siguiente año. • Cancelación de la matrícula y expulsión de la institución. • Otras que se consideren necesarias para dar el caso."},{"s":"11.4. Estructura de la ruta de atención integral para la convivencia escolar","p":70,"t":"La Ruta de Atención Integral para la Convivencia Escolar en el Liceo Paola es el conjunto de acciones, procedimientos y mecanismos que permiten la prevención, atención y seguimiento de situaciones que afecten la convivencia escolar y el ejercicio de los derechos de niños, niñas y adolescentes, en concordancia con la Ley 1620 de 2013, el Decreto 1965 de 2013 y demás normativas vigentes. 11.4.1Objetivos de la Ruta • Garantizar entornos escolares seguros, inclusivos y respetuosos. • Atender de manera oportuna, adecuada y efectiva las situaciones que vulneren los derechos de los estudiantes. • Promover la prevención de la violencia escolar, el acoso y cualquier forma de discriminación. • Fortalecer las competencias ciudadanas y la educación para la sexualidad."},{"s":"14.4.2 Componentes de la Ruta","p":70,"t":"La ruta se desarrolla en cuatro componentes básicos: Promoción • Implementación del Manual de Convivencia. • Fomento de los valores institucionales. • Actividades pedagógicas de educación para la paz, derechos humanos y prevención del acoso escolar. • Escuela de padres y talleres de habilidades socioemocionales. Prevención • Identificación temprana de factores de riesgo en la convivencia escolar. • Capacitación docente en mediación y resolución pacífica de conflictos. • Creación y fortalecimiento del Comité de Convivencia Escolar. Atención • Activación del protocolo ante la detección de una situación (según tipología: tipo I, II o III de la Ley 1620). • Intervención inmediata por el docente y reporte al Coordinador de Convivencia. • Remisión a instancias internas (Comité de Convivencia) y externas (ICBF, Comisaría de Familia, Policía de Infancia y Adolescencia) según el caso. • Garantía del debido proceso y confidencialidad. Seguimiento y Restablecimiento de Derechos"},{"s":"14.4.2 Componentes de la Ruta","p":71,"t":"• Monitoreo de los compromisos adquiridos por las partes. • Acompañamiento psicológico y pedagógico al estudiante afectado y a su familia. • Informe de seguimiento al Comité Escolar de Convivencia. Actores Responsables • Docentes y Directores de Grupo: Detección y reporte de casos. • Comité Escolar de Convivencia: Análisis, mediación y toma de decisiones. • Consejo Directivo: Aprobación y seguimiento de políticas. • Padres de Familia: Apoyo y cumplimiento de compromisos. • Entidades Externas: ICBF, Comisaría de Familia, Policía de Infancia, entre otros. Flujograma de la Ruta de Atención (Puedo diseñar un diagrama gráfico que muestre el paso a paso: Detección → Reporte → Análisis → Intervención → Remisión → Seguimiento)."},{"s":"11.4.1. Protocolo de atención para situaciones Tipo I. (faltas leves)","p":72,"t":"Los establecimientos educativos deben clasificar y definir sus protocolos institucionales para la atención de las situaciones tipo I de acuerdo con el Art 42 del Decreto 1965/2013. Estas faltas no involucran daño físico o psicológico a otros miembros de la comunidad educativa. 11.4.1.1. Clasificación de las situaciones tipo I. 1. Portar el uniforme de manera inadecuada, incompleto o con accesorios, prendas o modificaciones no autorizadas, así como utilizarlo en lugares o actividades no permitidas. 2. Presentar descuido en la higiene o en la presentación personal. 3. Utilizar joyas, piercings, maquillaje, tintes o estilos no acordes con las normas institucionales. 4. Utilizar apodos, sobrenombres o expresiones que afecten la dignidad de cualquier miembro de la comunidad educativa. 5. Emplear vocabulario vulgar, gestos obscenos, actitudes altaneras o manifestaciones irrespetuosas. 6. Incurrir en juegos bruscos o comportamientos que alteren la convivencia."},{"s":"11.4.1. Protocolo de atención para situaciones Tipo I. (faltas leves)","p":72,"t":"7. Manifestar expresiones afectivas o conductas inapropiadas contrarias al pudor, la decencia • las buenas costumbres. 8. Desatender observaciones u orientaciones de docentes o directivos. 9. Interrumpir el normal desarrollo de las clases o actos comunitarios con indisciplina o comportamientos distractores. 10. Promover el desorden en aulas, corredores u otros espacios institucionales. 11. Permanecer en lugares no autorizados o fuera de los espacios asignados durante la jornada escolar. 12. Adoptar posturas inadecuadas o permanecer acostado durante clases o actividades institucionales. 13. Utilizar el tiempo académico para actividades ajenas a las programadas. 14. Portar o usar objetos o materiales que perturben la tranquilidad o el desarrollo normal de las actividades escolares. 15. Hacer uso no autorizado de teléfonos celulares u otros dispositivos electrónicos durante clases o actos institucionales."},{"s":"11.4.1. Protocolo de atención para situaciones Tipo I. (faltas leves)","p":73,"t":"16. Hacer uso inadecuado de baños, mobiliario, recursos didácticos, equipos o demás bienes institucionales. 17. Arrojar basura o residuos en lugares no destinados o mantener sucio el espacio escolar. 18. Causar daño leve a bienes o instalaciones de la institución. 19. Dañar, tomar o utilizar sin autorización pertenencias de compañeros o miembros de la comunidad educativa. 20. Incurrir en inasistencias injustificadas o reiteradas. 21. Presentar llegadas tardías o impuntualidad a clases o eventos escolares. 22. No presentar tareas, trabajos, materiales o útiles requeridos para la clase. 23. Incumplir normas establecidas para evaluaciones o actividades académicas. 24. No entregar oportunamente citaciones o comunicaciones dirigidas a padres o acudientes. 25. Realizar ventas, rifas, colectas o actividades económicas sin autorización institucional. 26. Incumplir deberes contemplados en el presente Manual de Convivencia que no constituyan faltas de mayor gravedad."},{"s":"11.4.1. Protocolo de atención para situaciones Tipo I. (faltas leves)","p":73,"t":"27. Cualquier otra conducta que, por su naturaleza, sea clasificada por el Comité de Convivencia Escolar como Situación Tipo I. 11.4.1.2. Ruta de atención de situaciones tipo I. Este tipo de situaciones será atendido por el rector (a) (o quien haya sido designado para ello) en representación de todos los miembros del comité de convivencia escolar, sin necesidad de reunir a los otros miembros, para lo cual deberá: • Reunir inmediatamente a las partes involucradas en el conflicto y mediar de manera pedagógica para que éstas expongan sus puntos de vista y busquen la reparación de los daños causados, el restablecimiento de los derechos y la reconciliación dentro de un clima de relaciones constructivas. • Fijar la forma de solución de manera imparcial, equitativa y justa, encaminada a buscar la reparación de los daños causados, el restablecimiento de los derechos y la reconciliación dentro de un clima de relaciones constructivas en el grupo involucrado"},{"s":"11.4.1. Protocolo de atención para situaciones Tipo I. (faltas leves)","p":73,"t":"• en el establecimiento educativo. • Elaborar registro del hecho y de los compromisos adquiridos, (Agenda escolar y/o, en el observador) si son necesarios, el cual deberá ser firmado por las partes involucradas; este informe deberá ser presentado al resto de los miembros del comité de convivencia escolar en la siguiente reunión ordinaria. • Invitar a otros miembros de la comunidad en casos en los que, para la solución adecuada de la situación, y de criterio del rector (a), podrán ser citados a comparecer, así como también a estudiantes que hayan recibido capacitación como mediadores o conciliadores escolares en el manejo de este tipo de casos para que sean garantes del debido proceso y la aplicación de correctivos justos y equitativos con la falta cometida. • Realizar seguimiento del caso y de los compromisos a fin de verificar si la solución fue efectiva o si se requiere acudir a los protocolos consagrados en los artículos 43 y 44 del Decreto 1965/2013. Nota: algunas de las actividades de crecimiento personal o medidas reparadoras establecidas por la institución se deberán realizar después de culminada la jornada escolar, bajo la orientación del personal del colegio."},{"s":"11.4.1. Protocolo de atención para situaciones Tipo I. (faltas leves)","p":74,"t":"11.4.2. Protocolo de atención para situaciones Tipo II. Los establecimientos educativos deben clasificar y definir sus protocolos institucionales para la atención de las situaciones tipo II, acorde con el Art. 43 del Decreto 1965/2013. 11.4.2.1. Clasificación de las situaciones tipo II. Hacen parte del grupo de este tipo de situaciones: 1. Reincidir de manera sistemática en Situaciones Tipo I pese a las acciones pedagógicas implementadas. 2. Incurrir en agresiones físicas, verbales o psicológicas que causen daño o afectación a otro miembro de la comunidad educativa. 3. Realizar actos de intimidación, amenazas, burlas reiteradas, acoso escolar o ciberacoso. 4. Participar en riñas o enfrentamientos dentro o fuera de la institución portando el uniforme. 5. Generar daños intencionales o significativos a bienes institucionales o a la propiedad ajena. 6. Sustraer, retener o apropiarse indebidamente de pertenencias de otros."},{"s":"11.4.1. Protocolo de atención para situaciones Tipo I. (faltas leves)","p":74,"t":"7. Faltar al respeto de manera grave a docentes, directivos o cualquier miembro de la comunidad educativa. 8. Alterar, falsificar o adulterar documentos, firmas, calificaciones, excusas o comunicaciones institucionales. 9. Salir de la institución o ausentarse de actividades escolares sin autorización. 10. Usar indebidamente redes sociales o medios digitales para difamar, ofender o afectar la imagen de la institución o de sus miembros. 11. Portar, distribuir o consumir cigarrillos, vapeadores, bebidas alcohólicas o sustancias psicoactivas dentro de la institución. 12. Presentarse a la institución bajo efectos de alcohol o sustancias psicoactivas. 13. Incurrir en conductas de discriminación por razones de género, etnia, religión, condición física, orientación o cualquier otra. 14. Incumplir sanciones o compromisos pedagógicos previamente establecidos. 15. Cualquier otra conducta que el Comité de Convivencia Escolar determine como Situación Tipo II por su impacto en la convivencia."},{"s":"11.4.1. Protocolo de atención para situaciones Tipo I. (faltas leves)","p":75,"t":"11.4.2.2. Ruta de atención de situaciones tipo II. Este tipo de situaciones será atendido por el rector (a) (o quien haya sido designado para ello) en representación de todos los miembros del comité de convivencia escolar, y deberá convocar a reunión a los otros miembros, de manera ordinaria o extraordinaria, dada la gravedad del caso, según su criterio, para lo cual deberá: • En casos de daño al cuerpo o a la salud, garantizar la atención inmediata en salud física y mental de los involucrados, mediante la remisión a las entidades competentes, actuación de la cual se dejará constancia. • Cuando se requieran medidas de restablecimiento de derechos, remitir la situación a las autoridades administrativas, en el marco de la Ley 1098/2006, actuación de la cual se dejará constancia. • Adoptar las medidas para proteger a los involucrados en la situación de posibles acciones en su contra, actuación de la cual se dejará constancia."},{"s":"11.4.1. Protocolo de atención para situaciones Tipo I. (faltas leves)","p":75,"t":"• Informar de manera inmediata a los padres, madres o acudientes de todos los estudiantes involucrados. • Generar espacios en los que las partes involucradas y los padres, madres o acudientes de los estudiantes, puedan exponer y precisar lo acontecido, preservando, en cualquier caso, el derecho a la intimidad, confidencialidad y demás derechos. • Determinar las acciones restaurativas que busquen la reparación de los daños causados, el· restablecimiento de los derechos y la reconciliación dentro de un clima de relaciones constructivas en el establecimiento educativo; así como las consecuencias aplicables a quienes han promovido, contribuido o participado en la situación reportada. • El presidente del comité escolar de convivencia informará a los demás integrantes de este comité, sobre la situación ocurrida y las medidas adoptadas. El comité realizará el análisis y seguimiento, a fin de verificar si la solución fue efectiva o si se requiere acudir al protocolo consagrado en el artículo 44 del presente Decreto."},{"s":"11.4.1. Protocolo de atención para situaciones Tipo I. (faltas leves)","p":75,"t":"• El comité escolar de convivencia dejará constancia en acta de todo lo ocurrido y de las decisiones adoptadas, la cual será suscrita por todos los integrantes e intervinientes. • El presidente del comité escolar de convivencia reportará la información del caso al aplicativo que para el efecto se haya implementado en el Sistema de Información Unificado de Convivencia Escolar. • Elaborar registro del hecho y de los compromisos adquiridos, si son necesarios, el cual deberá ser firmado por las partes involucradas; este informe deberá ser presentado al resto de los miembros del comité de convivencia escolar para la toma de los correctivos • sanciones a que hubiese lugar. 11.4.3. Protocolo de atención para situaciones Tipo III. Los establecimientos educativos deben clasificar y definir sus protocolos institucionales para la atención de las situaciones tipo III, de acuerdo con lo dispuesto en el Art. 44 del Decreto 1965/2013."},{"s":"11.4.3.1. Clasificación de las situaciones tipo III. (faltas graves y gravísimas)","p":76,"t":"1. Agresiones físicas que generen lesiones graves o incapacidad. 2. Porte, uso o distribución de armas, explosivos o elementos que pongan en riesgo la vida o la integridad de la comunidad educativa. 3. Tráfico, porte o comercialización de sustancias psicoactivas o alcohólicas. 4. Actos de violencia sexual, acoso sexual o cualquier conducta que atente contra la libertad e integridad sexual. 5. Amenazas graves, extorsión o coacción. 6. Hurto calificado, vandalismo grave o destrucción intencional de bienes institucionales o personales. 7. Vinculación a pandillas, conductas delictivas o actividades ilícitas dentro o en nombre de la institución. 8. Suplantación de identidad con fines fraudulentos. 9. Cualquier conducta tipificada como delito en la legislación colombiana que afecte a la comunidad educativa. 10. Cualquier otra conducta que, por su gravedad, sea clasificada por el Comité de Convivencia Escolar como Situación Tipo III y requiera intervención de autoridades externas."},{"s":"11.4.3.2. Ruta de atención de situaciones tipo III","p":77,"t":"Este tipo de situaciones será atendido por el rector (a) (o quien ésta haya designado para tal caso) en representación de todos los miembros del comité de convivencia escolar, y deberá convocar a reunión a los otros miembros, de manera ordinaria o extraordinaria, dada la gravedad del caso, para lo cual deberá: • En casos de daño al cuerpo o a la salud, garantizar la atención inmediata en salud física y mental de los involucrados, mediante la remisión a las entidades competentes, actuación de la cual se dejará constancia. • Informar de manera inmediata a los padres, madres o acudientes de todos los estudiantes involucrados, actuación de la cual se dejará constancia. • El presidente del Comité Escolar de Convivencia de manera inmediata y por el medio más expedito, pondrá la situación en conocimiento de la Policía Nacional, actuación de la cual se dejará constancia. • No obstante, lo dispuesto en el numeral anterior, se citará a los integrantes del comité escolar de convivencia en los términos fijados en el manual de convivencia. De la citación se dejará constancia."},{"s":"11.4.3.2. Ruta de atención de situaciones tipo III","p":77,"t":"• Excepcionalmente, al iniciarse el procedimiento o en cualquier momento de su instrucción, el Rector por decisión propia o a respuesta, en su caso, podrá optar las medidas profesionales que estime convenientes, estas podrán consistir en la suspensión con el derecho de asistencia a la institución por un periodo de (3) a (5) días. Donde el estudiante deberá realizar tareas (carteleras, charlas a sus compañeros, labor social, etc.) dirigidas a la reparación del daño. • Reflexión familiar extra clases. • Suspensión al derecho de la participación extra escolares o complementarias que tienen permiso o programadas por la institución. • Realización de trabajos específicos en horario Extra-escolar, bajo la supervisión de un docente o directivo docente. • Las medidas adoptadas serán comunicadas por escrito al Consejo Directivo. Falta gravísima. Las faltas gravísimas a las normas de convivencia de la Institución serán sancionadas por las instancias decisorias de la institución ante el incumplimiento de compromisos del estudiante y de la familia y/o acudiente. Estas sanciones son:"},{"s":"11.4.3.2. Ruta de atención de situaciones tipo III","p":77,"t":"Desescolarización por lo que resta del año lectivo. Expulsión de la Institución, lo que conlleva el retiro del estudiante de la misma. Exclusión de la ceremonia de grado cuando se trate de un estudiante del grado undécimo. • El presidente del comité escolar de convivencia informará a los participantes en el comité, de los hechos que dieron lugar a la convocatoria, guardando reserva de aquella información que pueda atentar contra el derecho a la intimidad y confidencialidad de las partes involucradas, así como del reporte realizado ante la autoridad competente. • Pese a que una situación se haya puesto en conocimiento de las autoridades. competentes, el comité escolar de convivencia adoptará, de manera inmediata, las medidas propias del establecimiento educativo, tendientes a proteger dentro del ámbito de sus competencias a la víctima, a quien se le atribuye la agresión y a las personas que hayan informado o hagan parte de la situación presentada, actuación de la cual se dejará constancia."},{"s":"11.4.3.2. Ruta de atención de situaciones tipo III","p":78,"t":"• El Rector (a), como presidente del comité escolar de convivencia reportará la información del caso al aplicativo que para el efecto se haya implementado en el Sistema de Información Unificado de Convivencia Escolar. • Los casos sometidos a este protocolo serán objeto de seguimiento por parte del comité escolar de convivencia, de la autoridad que asuma el conocimiento y del comité municipal, distrital o departamental de convivencia escolar que ejerza jurisdicción sobre el establecimiento educativo en el cual se presentó el hecho."},{"s":"11.5. Acciones para el fortalecimiento y la garantía de aplicación de los principios","p":78,"t":"de la ruta integral para la convivencia escolar"},{"s":"11.5.1. Acciones del componente de promoción","p":78,"t":"Se consideran acciones de promoción las políticas institucionales que se concentran en el fomento de la convivencia y en el mejoramiento del clima escolar, con el fin de generar un entorno para el ejercicio real y efectivo de los derechos humanos, sexuales y reproductivos en los términos establecidos en la Ley 1620 de 2013 y el Art. 36 del Decreto 1965/2013. Para garantizar la promoción de los principios definidos en la ruta integral para la convivencia escolar y propiciar su fortalecimiento y mejora continua, tendrá que cuenta que se deben: • Realizar acciones pertinentes para el ajuste del manual de convivencia, su socialización, apropiación de su contenido y para su fortalecimiento y aplicación efectiva. • Implementar las acciones necesarias que favorezcan el bienestar individual y colectivo, que puedan ser desarrolladas en el marco del proyecto educativo institucional – PEI. • Identificar necesidades de formación de la comunidad educativa sobre las temáticas referidas a los derechos humanos, sexuales y reproductivos, sexualidad, competencias ciudadanas, desarrollo infantil y adolescente, convivencia, y mediación y conciliación, para fortalecer el Sistema Nacional de Convivencia Escolar."},{"s":"11.5.1. Acciones del componente de promoción","p":78,"t":"• Fortalecer y hacer operativo los proyectos pedagógicos institucionales necesarios para la formación integral de los educandos y la realización de proyectos de vida, como mecanismos de fortalecimiento de las competencias ciudadanas, el ejercicio sano de la sexualidad y de la prevención de conductas inadecuadas o delictivas. • Revisar, articular el diseño, hacer seguimiento y evaluación a los planes de las asignaturas para que el desarrollo de competencias ciudadanas y la formación para el ejercicio de los derechos humanos, sexuales y reproductivos se lleve a cabo de manera transversal en cada uno de ellos, de acuerdo con lo establecido en el PEI. • Articular el diseño, implementación, seguimiento y evaluación de proyectos para el desarrollo de competencias ciudadanas orientados a fortalecer un clima escolar y de aula positivos que aborden como mínimo temáticas relacionadas con la clarificación de normas, la definición de estrategias para la toma de decisiones, la concertación y la negociación de intereses y objetivos, el ejercicio de habilidades comunicativas, emocionales y cognitivas a favor de la convivencia escolar, entre otros."},{"s":"11.5.2. Acciones del componente de Prevención","p":79,"t":"Se consideran acciones de prevención aquellas que buscan intervenir oportunamente en los comportamientos que podrían afectar la realización efectiva de los derechos humanos, sexuales y reproductivos con el fin de evitar que se constituyan en patrones de interacción que alteren la convivencia de los miembros de la comunidad educativa, tal como lo dispone el Art. 37 del Decreto 1965/2013. Para garantizar la prevención de la ocurrencia de situaciones que puedan afectar los principios definidos en la ruta integral para la convivencia escolar o su fortalecimiento y mejora continua, tendrá que cuenta acciones encaminadas a: • Identificar los riesgos de ocurrencia de las situaciones que se consideran más comunes en la afectación de la convivencia escolar y el ejercicio de los derechos humanos, sexuales y reproductivos • Tener presentes las particularidades del clima escolar de esta institución y del análisis de las características familiares, sociales, políticas, económicas y culturales externas de los estudiantes y que inciden en las relaciones interpersonales de la comunidad educativa."},{"s":"11.5.2. Acciones del componente de Prevención","p":79,"t":"• Implementar programas y estrategias para contribuyan a la mitigación de las situaciones que afectan la convivencia escolar y el ejercicio de los derechos humanos, sexuales y reproductivos previamente identificadas a partir de las particularidades de la comunidad educativa y el entorno en el que se encuentra. • La aplicación de los protocolos diseñados para la atención oportuna e integral de las situaciones más comunes que afectan la convivencia escolar y el ejercicio de los derechos humanos, sexuales y reproductivos, tales como: • Amonestación verbal en privado. Se asume como una acción preventiva, como un correctivo pedagógico, en el caso de faltas Tipo I. Es realizada por el docente mediante un dialogo reflexivo, constructivo y formativo con el estudiante, para que tome conciencia sobre la falta y se comprometa con un cambio de actitud. El compromiso se registrará en el observador del alumno."},{"s":"11.5.2. Acciones del componente de Prevención","p":80,"t":"• Presentar excusa y resarcir los efectos de su conducta con la persona afectada. • Asignación de un trabajo formativo y de reparación, elaboración de actividades, reflexiones orales o escritas relacionadas con la falta cometida y exposición ante los compañeros en espacios de formación. • Los profesores dialogan con el rector (a) (o quien ésta haya designado para ello) sobre los problemas de comportamiento de sus alumnos, para obtener mayor información y una visión a fondo del manejo de la situación. • Los profesores dialogan con el psicólogo (en caso necesario) los problemas de comportamiento de sus estudiantes, para obtener mayor información y una visión a fondo del manejo de la situación. • Los profesores remiten a los estudiantes (en caso necesario) para que el psicólogo los oriente. • Si con los anteriores procedimientos no se logran los resultados que desean, el alumno se remitirá entonces a procedimientos disciplinares."},{"s":"11.5.2. Acciones del componente de Prevención","p":80,"t":"• Amonestación escrita por parte del docente, si se vuelve a presentar un comportamiento inadecuado y no se nota mejoría, dejándose constancia en el observador del alumno y notificando al padre de familia o acudiente. • Citación al padre de familia o acudiente a la dirección, Se dialogará con éstos para analizar conjuntamente las dificultades presentadas por el alumno y tomar medidas disciplinarias como: • Presentarse en un horario extracurricular y realizar actividades o acciones reparadoras relacionadas con la falta cometida. • Reparación o pago del daño ocasionado a equipos, muebles o enseres, acompañado de un trabajo formativo."},{"s":"11.5.3. Acciones del componente de Atención","p":80,"t":"Se consideran acciones de atención aquellas que permitan asistir a los miembros de la comunidad educativa frente a las situaciones que afectan la convivencia escolar y el ejercicio de los derechos humanos, sexuales y reproductivos, mediante la implementación y aplicación de los protocolos internos de los establecimientos educativos y la activación cuando fuere necesario, de los protocolos de atención que para el efecto se tengan implementados por parte de los demás actores que integran el Sistema Nacional de Convivencia Escolar en el ámbito de su competencia, en los términos que demanda el Art. 38 del Decreto 1965/2013. Entre estas se tendrán cuenta acciones como: a) Amonestación escrita por retardo; citación a padres de familia por retardos recurrentes; con 3 retardos acumulados no podrá interrumpir las clases ya iniciadas, por lo que deberá esperar el cambio de clase; el cuarto retardo generará una medida reparadora establecida"},{"s":"11.5.3. Acciones del componente de Atención","p":81,"t":"por la institución, la cual deberá realizar después de culminada la jornada escolar, bajo la orientación del personal del colegio b) Firma de compromiso disciplinario para ser cumplido durante el resto del año escolar. c) Suspensión de uno a tres días, con efectos académicos en caso de evaluaciones, tareas u otros derivados del mismo. La amonestación se diligenciará con motivos, compromisos, correctivos y presentación del acudiente el día de la suspensión o al día siguiente, de lo contrario el alumno no podrá presentarse a clases; las suspensiones podrán ser cumplidas dentro del colegio o en la casa. d) Matricula condicional, será aplicada por no haber cumplido el compromiso disciplinario, la reincidencia en faltas y/o bajo rendimiento académico representado en la insuficiencia de 3 asignaturas. Se citará a los padres y se elaborará el acta correspondiente. e) Cancelación del contrato educativo, será aplicado por la reiteración de las faltas que ocasionaron la matricula condicional, se llevará el caso al consejo directivo. f) El alumno que en su seguimiento durante todo el año antes de graduarse, presente faltas al Manual de Convivencia que lo identifiquen como indisciplinado y con poca muestra de la vivencia de los principios del PEI, no será proclamado en comunidad en la ceremonia de graduación, recibirá su diploma en la dirección. g) Para la aplicación de algunas de las sanciones anteriores se podrá omitir algunos de los pasos del anterior procedimiento de acuerdo con la gravedad de la falta. En todos los casos el estudiante tendrá derecho a ser escuchado, a presentar los descargos a que haya lugar en el estamento correspondiente y sus padres podrán apelar ante el Consejo Directivo."},{"s":"11.6. Parámetros de Convivencia para los miembros de la comunidad educativa","p":81,"t":"Toda persona está obligada a cumplir la Constitución y las leyes, está establecido en el Art. 95 de Constitución Política de Colombia: de igual forma, en la Ley 1620 de 2013, se han formulado una serie de responsabilidades compartidas entre todos los estamentos y miembros de la comunidad educativa, así: el Art. 17 relaciona las correspondientes a la institución, el Art. 18 define las referidas al rector, el Art. 19 impone las propias de los docentes y el Art. 22 establece las asociadas a las familias."},{"s":"11.6.1. Responsabilidades de la Institución Educativa","p":81,"t":"11.6.1.1. Responsabilidades frente a la Ley 1620/2013. Ley 1620/2013, Art. 17. Además de las que establece la normatividad vigente y que le son propias, tendrá las siguientes responsabilidades: • Garantizar a sus estudiantes, educadores, directivos docentes y demás personal de los establecimientos escolares el respeto a la dignidad e integridad física y moral en el marco de la convivencia escolar, los derechos humanos, sexuales y reproductivos. • Implementar el comité escolar de convivencia y garantizar el cumplimiento de sus funciones acorde con lo estipulado en los artículos 11, 12 y 13 de la presente ley. • Desarrollar los componentes de prevención, promoción y protección a través del manual de convivencia, y la aplicación de la Ruta de Atención Integral para la Convivencia Escolar, con el fin de proteger a los estudiantes contra toda forma de acoso, violencia escolar y vulneración de los derechos humanos, sexuales y reproductivos, por parte de los demás compañeros, profesores o directivos docentes."},{"s":"11.6.1. Responsabilidades de la Institución Educativa","p":82,"t":"• Revisar y ajustar el Proyecto Educativo Institucional, el Manual de Convivencia, y el sistema institucional de evaluación de estudiantes anualmente, en un proceso participativo que involucre a los estudiantes y en general a la comunidad educativa, a la luz de los enfoques de derechos, de competencias y diferencial, acorde con la Ley General de Educación, la Ley 1098 de 2006 y las normas que las desarrollan. • Revisar anualmente las condiciones de convivencia escolar del establecimiento educativo e identificar factores de riesgo y factores protectores que incidan en la convivencia escolar, protección de derechos humanos, sexuales y reproductivos, en los procesos de autoevaluación institucional o de certificación de calidad, con base en la implementación de la Ruta de Atención Integral y en las decisiones que adopte el comité escolar de convivencia. • Emprender acciones que involucren a toda la comunidad educativa en un proceso de reflexión pedagógica sobre los factores asociados a la violencia y el acoso escolar y la vulneración de los derechos sexuales y reproductivos y el impacto de los mismos, incorporando conocimiento pertinente acerca del cuidado del propio cuerpo y de las relaciones con los demás, inculcando la tolerancia y el respeto mutuo."},{"s":"11.6.1. Responsabilidades de la Institución Educativa","p":82,"t":"• Desarrollar estrategias e instrumentos destinados a promover la convivencia escolar a partir de evaluaciones y seguimiento de las formas de acoso y violencia escolar más frecuentes. • Adoptar estrategias para estimular actitudes entre los miembros de la comunidad educativa que promuevan y fortalezcan la convivencia escolar, la mediación y reconciliación y la divulgación de estas experiencias exitosas. • Generar estrategias pedagógicas para articular procesos de formación entre las distintas áreas de estudio. 11.6.1.2. Responsabilidades frente al Decreto 1290/2009. Ley 1620/2013, Art. 17. Además de las que establece la normatividad vigente y que le son propias, tendrá las siguientes responsabilidades: • Garantizar a sus estudiantes, educadores, directivos docentes y demás personal de los establecimientos escolares el respeto a la dignidad e integridad física y moral en el marco de la convivencia escolar, los derechos humanos, sexuales y reproductivos."},{"s":"11.6.1. Responsabilidades de la Institución Educativa","p":82,"t":"• Implementar el comité escolar de convivencia y garantizar el cumplimiento de sus funciones acorde con lo estipulado en los artículos 11, 12 y 13 de la presente ley. • Desarrollar los componentes de prevención, promoción y protección a través del manual de convivencia, y la aplicación de la Ruta de Atención Integral para la Convivencia Escolar, con el fin de proteger a los estudiantes contra toda forma de acoso, violencia escolar y vulneración de los derechos humanos, sexuales y reproductivos, por parte de los demás compañeros, profesores o directivos docentes. • Revisar y ajustar el Proyecto Educativo Institucional, el Manual de Convivencia, y el sistema institucional de evaluación de estudiantes anualmente, en un proceso participativo que involucre a los estudiantes y en general a la comunidad educativa, a la luz de los enfoques de derechos, de competencias y diferencial, acorde con la Ley General de Educación, la Ley 1098 de 2006 y las normas que las desarrollan."},{"s":"11.6.1. Responsabilidades de la Institución Educativa","p":83,"t":"• Revisar anualmente las condiciones de convivencia escolar del establecimiento educativo e identificar factores de riesgo y factores protectores que incidan en la convivencia escolar, protección de derechos humanos, sexuales y reproductivos, en los procesos de autoevaluación institucional o de certificación de calidad, con base en la implementación de la Ruta de Atención Integral y en las decisiones que adopte el comité escolar de convivencia. • Emprender acciones que involucren a toda la comunidad educativa en un proceso de reflexión pedagógica sobre los factores asociados a la violencia y el acoso escolar y la vulneración de los derechos sexuales y reproductivos y el impacto de los mismos, incorporando conocimiento pertinente acerca del cuidado del propio cuerpo y de las relaciones con los demás, inculcando la tolerancia y el respeto mutuo. • Desarrollar estrategias e instrumentos destinados a promover la convivencia escolar a partir de evaluaciones y seguimiento de las formas de acoso y violencia escolar más frecuentes."},{"s":"11.6.1. Responsabilidades de la Institución Educativa","p":83,"t":"• Adoptar estrategias para estimular actitudes entre los miembros de la comunidad educativa que promuevan y fortalezcan la convivencia escolar, la mediación y reconciliación y la divulgación de estas experiencias exitosas. • Generar estrategias pedagógicas para articular procesos de formación entre las distintas áreas de estudio."},{"s":"11.5.6 Objetivos del Componente Preventivo","p":83,"t":"• Promover el bienestar socioemocional de los estudiantes. • Prevenir conductas de riesgo que afecten la salud mental. • Fortalecer habilidades para la resolución pacífica de conflictos y la gestión emocional. • Garantizar entornos escolares protectores y seguros. Acciones Estratégicas a. Educación Socioemocional • Implementación de talleres sobre inteligencia emocional, autocontrol, empatía y resiliencia. • Inclusión de contenidos de educación emocional en las áreas curriculares. b. Detección Temprana de Factores de Riesgo • Aplicación de encuestas y pruebas diagnósticas sobre bienestar emocional. • Observación sistemática del comportamiento en el aula. • Canalización inmediata al orientador escolar ante signos de alerta. c. Escuela para Padres • Jornadas formativas sobre manejo de emociones en el hogar, comunicación asertiva y prevención del suicidio y la depresión en adolescentes. d. Fortalecimiento del Orientador Escolar y Red de Apoyo"},{"s":"11.5.6 Objetivos del Componente Preventivo","p":84,"t":"• Asesoría psicológica individual y grupal. • Remisión oportuna a EPS, ICBF o entidades de salud mental en casos que lo requieran. e. Campañas Institucionales de Bienestar • Días de la salud mental, actividades lúdicas, pausas activas y espacios de escucha activa. • Estrategias de sensibilización contra el estigma hacia la salud mental. f. Prevención del Consumo de SPA y Conductas Auto lesivas • Charlas con profesionales externos (psicólogos, médicos, Policía de Infancia). • Implementación del Programa Escolar de Prevención Integral. 11.4.3.1 Responsabilidades frente al Decreto 1290/2009. Decreto 1290/2009. Art. 11. El establecimiento educativo, debe: • Definir, adoptar y divulgar el sistema institucional de evaluación de estudiantes, después de su aprobación por el consejo académico. • Incorporar en el proyecto educativo institucional los criterios, procesos y procedim ientos de evaluación; estrategias para la superación de debilidades y promoción de los estudiantes, definidos por el consejo directivo."},{"s":"11.5.6 Objetivos del Componente Preventivo","p":84,"t":"• Promover y mantener la interlocución con los padres de familia y el estudiante, con el fi n depresentar los informes periódicos de evaluación, el plan de actividades de apoyo para l a superación de las debilidades, y acordar los compromisos por parte de todos los i nvolucrados. • Crear comisiones u otras instancias para realizar el seguimiento de los procesos de evaluación y promoción de los estudiantes si lo considera pertinente. • Atender los requerimientos de los padres de familia y de los estudiantes, y programar reuniones con ellos cuando sea necesario. • A través de consejo directivo servir de instancia para decidir sobre reclamaciones que presenten los estudiantes o sus padres de familia en relación con la evaluación o promoción. • Analizar periódicamente los informes de evaluación con el fin de identificar prácticas escolar es que puedan estar afectando el desempeño de los estudiantes, e introducir las modificaciones que sean necesarias para mejorar."},{"s":"11.5.6 Objetivos del Componente Preventivo","p":85,"t":"• Presentar a las pruebas censales SABER ICFES la totalidad de los estudiantes que se encuentren matriculados en los grados evaluados, y colaborar con éste en los procesos de inscripción y aplicación de las pruebas, según se le requiera."},{"s":"11.4.3.2 Responsabilidades, Derechos y Deberes del Rector","p":85,"t":"de la Institución Educativa a. Responsabilidades del Rector (a) de la Institución Ley 1620/2013, Art. 18, además de las que establece normatividad vigente y que le son propias, tendrá las siguientes responsabilidades: • Liderar el comité escolar de convivencia acorde con lo estipulado en los artículos 11, 12 y 13 de la ley en mención. • Incorporar en los procesos de planeación institucional el desarrollo de los componentes de prevención y de promoción, y los protocolos o procedimientos establecidos para la implementación de la ruta de atención integral para la convivencia escolar. • Liderar la revisión y ajuste del proyecto educativo institucional, el manual de convivencia, y el sistema institucional de evaluación anualmente, en un proceso participativo que involucre a los estudiantes y en general a la comunidad educativa, en el marco del Plan de Mejoramiento Institucional. • Reportar aquellos casos de acoso y violencia escolar y vulneración de derechos sexuales y reproductivos de los niños, niñas y adolescentes del establecimiento educativo, en su calidad de presidente del comité escolar de convivencia, acorde con la normatividad vigente y los protocolos definidos en la Ruta de Atención Integral y hacer seguimiento a dichos casos."},{"s":"11.4.3.2 Responsabilidades, Derechos y Deberes del Rector","p":85,"t":"b. Derechos y deberes del Rector (a) de la Institución Son derechos y deberes del rector (a) de la institución los establecidos por la normatividad vigente y los definidos en el Manual de Funciones del Sistema de Gestión de Calidad de la Institución Educativa LICEO PAOLA."},{"s":"11.4.3.3 Responsabilidades, Derechos y Deberes de los","p":85,"t":"Docentes de la Institución a. Responsabilidades de los docentes de la institución Ley 1620/2013, Art. 19, además de las que establece la normatividad vigente y que le son propias, tendrán las siguientes responsabilidades: • Identificar, reportar y realizar el seguimiento a los casos de acoso escolar, violencia escolar y vulneración de derechos sexuales y reproductivos que afecten a estudiantes del establecimiento educativo, acorde con los artículos 11 y 12 de la Ley 1146 de 2007 y demás normatividad vigente, con el Manual de Convivencia y con los protocolos definidos en la Ruta de Atención Integral para la Convivencia Escolar. • Si la situación de intimidación de la que tienen conocimiento se hace a través de medios electrónicos, igualmente deberá reportar al comité de convivencia para activar el protocolo respectivo. • Transformar las prácticas pedagógicas para contribuir a la construcción de ambientes de aprendizajes democráticos y tolerantes que potencien la participación, la construcción colectiva de estrategias para la resolución de conflictos, el respeto a la dignidad humana, a la vida, a la integridad física y moral de los estudiantes."},{"s":"11.4.3.3 Responsabilidades, Derechos y Deberes de los","p":86,"t":"• Participar de los procesos de actualización y de formación docente y de evaluación del clima escolar del establecimiento educativo. • Contribuir a la Construcción y Aplicación del Manual de Convivencia. b. Derechos de los docentes de la institución Son derechos de los docentes de la institución Educativa LICEO PAOLA • Las contempladas en la normatividad legal vigente. • Al respeto por su dignidad, identidad, diferencias étnicas, religiosas sin que el proselitismo perjudique el bien común. • A un ambiente de trabajo propicio para el desarrollo de su labor profesional. • A los bienes y recursos necesarios para desempeñar su labor. • A participar directamente o a través de sus representantes en los diversos organismos de la Institución Educativa en la planeación, realización y evaluación del proceso educativo, a elegir y ser elegido para dichos organismos. • A recibir atención respetuosa, amable y sincera de diálogo por parte de los estamentos de la comunidad educativa."},{"s":"11.4.3.3 Responsabilidades, Derechos y Deberes de los","p":86,"t":"• A la libre y respetuosa expresión de conceptos y opiniones. • A la posibilidad de acudir y ser escuchado por instancias superiores de autoridad, siguiendo los conductos regulares de comunicación establecida. • A un proceso de seguimiento y evaluación profesional orientado al mejoramiento continuo. • A participar en planes y programas de capacitación profesional. • A recibir oportunamente los pagos o reconocimientos contractuales legales. • A recibir información oportuna. • A que se acepten incapacidades de entidades reconocidas a nivel nacional. c. Deberes de los docentes de la institución Un docente del LICEO PAOLA debe desarrollar y guiar el aprendizaje de los estudiantes asumiendo todas las responsabilidades que el ejercicio de la pedagogía moderna demanda y el compromiso de afianzar en ellos, los valores y actitudes necesarios para poder convivir y desarrollar sus potencialidades plenamente. Debe:"},{"s":"11.4.3.3 Responsabilidades, Derechos y Deberes de los","p":87,"t":"• Incentivar el amor y respeto por la Institución y todos sus estamentos velando siempre por el buen nombre del Establecimiento Educativo • Cuidar los recursos físicos, didácticos e institucionales. • Las obligaciones adquiridas con otras instituciones no deben interferir los compromisos contraídos con el Establecimiento Educativo. • Corresponder con actitud positiva las oportunidades de formación y capacitación profesional que el LICEO PAOLA programe. • Elaborar estrategias de nivelación para los estudiantes, en caso de no poder asistir a clase, siguiendo las indicaciones de la dirección. • Ser responsable con sus actividades académicas y entregar sus responsabilidades en el momento oportuno según cronograma de actividades. • Cumplir con el horario estipulado. • Capacitarse en pedagogía conceptual. Con el objetivo de mantener la convivencia armónica entre estudiantes y padres de familia, así como de otros miembros de la comunidad educativa interesados en el proceso educativo que se desarrolla en la Institución Educativa LICEO PAOLA, los docentes deberán ser:"},{"s":"11.4.3.3 Responsabilidades, Derechos y Deberes de los","p":87,"t":"• Guía del proceso formativo, respetando el ritmo personal y la individualidad del estudiante, y cumplir a cabalidad con sus deberes profesionales: puntualidad, preparación de clases y actividades, implementación de la evaluación cualitativa y responsabilidad en la devolución oportuna de trabajos y evaluaciones debidamente revisadas. • Formadores de personas y educar en los valores corporativos institucionales y en normas de convivencia a todos los estudiantes del establecimiento, no solo a aquellos a los que están bajo su orientación académica. • Cuidadosos de su quehacer docente, dar a conocer los resultados de las evaluaciones del proceso de aprendizaje y normas de comportamiento de manera oportuna, con posibilidad de que los estudiantes los puedan revisar, recibir las aclaraciones necesarias y puedan ser escuchados antes de informar a la Dirección Académica o Padres de Familia el resultado de todo proceso evaluado."},{"s":"11.4.3.4 Derechos y deberes del Personal","p":87,"t":"Administrativo Son derechos y deberes de del personal administrativo de la institución los establecidos por la normatividad legal vigente y los definidos en el Manual de Funciones del Sistema de Gestión de Calidad de la Institución LICEO PAOLA."},{"s":"11.4.3.5 Responsabilidades, Derechos y Deberes de los","p":88,"t":"Padres y Madres de Familia a. Responsabilidades frente a la Ley 1620/2013. Ley 1620/2013, Art. 22. Además de las obligaciones consagradas en el artículo 67 de la Constitución Política, en la Ley 115 de 1994, la Ley 1098 de 2006, la Ley 1453 de 2011 y demás normas vigentes, deberá: • Proveer a sus hijos espacios y ambientes en el hogar, que generen confianza, ternura, cuidado y protección de sí y de su entorno físico, social y ambiental. • Participar en la formulación, planeación y desarrollo de estrategias que promuevan la convivencia escolar, los derechos humanos, sexuales y reproductivos, la participación y la democracia, y el fomento de estilos de vida saludable. • Acompañar de forma permanente y activa a sus hijos en el proceso pedagógico que adelante el establecimiento educativo para la convivencia y la sexualidad. • Participar en la revisión y ajuste del manual de convivencia a través de las instancias de participación definidas en el proyecto educativo institucional del establecimiento educativo."},{"s":"11.4.3.5 Responsabilidades, Derechos y Deberes de los","p":88,"t":"• Asumir responsabilidades en actividades para el aprovechamiento del tiempo libre de sus hijos para el desarrollo de competencias ciudadanas. • Cumplir con las condiciones y obligaciones establecidas en el manual de convivencia y responder cuando su hijo incumple alguna de las normas allí definidas. • Conocer y seguir la Ruta de Atención Integral cuando se presente un caso de violencia escolar, la vulneración de los derechos sexuales y reproductivos o una situación que lo amerite, de acuerdo con las instrucciones impartidas en el manual de convivencia del respectivo establecimiento educativo. • Utilizar los mecanismos legales existentes y los establecidos en la Ruta de Atención Integral a que se refiere esta ley, para restituir los derechos de sus hijos cuando estos sean agredidos. b. Responsabilidades frente al Decreto 1286/2005. Decreto 1286/2005. Art. 3 Con el fin de asegurar el cumplimiento de los compromisos adquiridos con la educación de sus hijos, corresponden a los padres y madres de familia:"},{"s":"11.4.3.5 Responsabilidades, Derechos y Deberes de los","p":89,"t":"• Matricular oportunamente a sus hijos en establecimientos educativos debidamente reconocidos por el Estado y asegurar su permanencia durante su edad escolar obligatoria. • Contribuir para que el servicio educativo sea armónico con el ejercicio del derecho a la educación y en cumplimiento de sus fines sociales y legales. • Cumplir con las obligaciones contraídas en el acto de matrícula y en el manual de convivencia, para facilitar el proceso de educativo. • Contribuir en la construcción de un clima de respeto, tolerancia y responsabilidad mutua que favorezca la educación de los hijos y la mejor relación entre los miembros de la comunidad educativa. • Comunicar oportunamente, y en primer lugar a las autoridades del establecimiento educativo, las irregularidades de que tengan conocimiento, entre otras, en relación con el maltrato infantil, abuso sexual, tráfico o consumo de drogas ilícitas. En caso de no recibir pronta respuesta acudir a las autoridades competentes."},{"s":"11.4.3.5 Responsabilidades, Derechos y Deberes de los","p":89,"t":"• Apoyar al establecimiento en el desarrollo de las acciones que conduzcan al mejoramiento del servicio educativo y que eleven la calidad de los aprendizajes, especialmente en la formulación y desarrollo de los planes de mejoramiento institucional. • Acompañar el proceso educativo en cumplimiento de su responsabilidad como primeros educadores de sus hijos, para mejorar la orientación personal y el desarrollo de valores ciudadanos. • Participar en el proceso de autoevaluación anual del establecimiento educativo. c. Responsabilidades frente al Decreto 1290/2009. Decreto 1290/2009. Art. 15. De conformidad con las normas vigentes, es responsabilidad de los padres de familia: • Participar, a través de las instancias del gobierno escolar, en la definición de criterios y procedimientosde la evaluación del aprendizaje de los estudiantes y promoción escolar • Realizar seguimiento permanente al proceso evaluativo de sus hijos"},{"s":"11.4.3.5 Responsabilidades, Derechos y Deberes de los","p":89,"t":"• Analizar los informes periódicos de evaluación d. Derechos de los Padres y Madres de Familia Decreto 1290/2009. En el proceso formativo de sus hijos, los padres de familia tienen los siguientes derechos: • Conocer el sistema institucional de evaluación de los estudiantes: criterios, procedi mientos e instrumentos de evaluación y promoción desde el inicio de año escolar. • Acompañar el proceso evaluativo de los estudiantes. • Recibir los informes periódicos de evaluación. • Recibir oportunamente respuestas a las inquietudes y solicitudes presentadas sobr e el proceso de evaluación de sus hijos. Así mismo, los Padres y madres de familia de la Institución Educativa LICEO PAOLA tienen derecho a: • Pertenecer a la Asociación de padres de familia, con derecho a elegir y ser elegido, directivo de la misma. • Elegir y a ser elegido para formar parte del Consejo Directivo. • Expresar sus opiniones ante decisiones importantes del plantel, que influyan en la educación integral de los niños."},{"s":"11.4.3.5 Responsabilidades, Derechos y Deberes de los","p":90,"t":"• Ser escuchado y ayudado por la dirección del plantel en caso de reclamos o necesidades. • Proponer iniciativas y sugerencias que estén de acuerdo con las normas vigentes y contribuyan a mejorar el funcionamiento del plantel. • Exigir idoneidad profesional en el profesorado. • Solicitar al departamento de Bienestar asesoría para sus hijos, cuando lo considere necesario. • Hacer reclamos justos, respetuosos y decorosos dentro del tiempo fijado por las normas legales e institucionales. • Tener permanentemente comunicación con los profesores de sus hijos, de manera que pueda estar al tanto de los logros o dificultades en el Aprendizaje de sus hijos; podrán ser atendidos por los profesores en el horario acordado con sus docentes. • Recibir el informe académico por periodos, siempre y cuando se halle al día con el pago de pensiones. • Colaborar y participar en el plan y desarrollo de las actividades programadas por el la Institución Educativa"},{"s":"11.4.3.5 Responsabilidades, Derechos y Deberes de los","p":90,"t":"• Obtener información oportuna acerca del manual de convivencia y reglamento escolar del Establecimiento Educativo LICEO PAOLA. e. Deberes de los Padres y Madres de Familia Los Padres de familia de la Institución Educativa LICEO PAOLA se comprometen a cumplir con los siguientes deberes: • Cumplir con el horario escolar de sus hijos, teniendo en cuenta la puntualidad, el uniforme y la presentación personal de ellos. • Incentivar el amor y respeto por la Institución y todos sus estamentos velando siempre por el buen nombre del Colegio • Participar activamente en reuniones de padres, escuelas, asambleas y eventos programados por el Establecimiento y la Asopadres así como a las citaciones individuales. • Responder por el comportamiento de sus hijos dentro y fuera del colegio. • Comprometerse cuando se le solicite, activa y participativamente en el proceso terapéutico que el niño requiera, de modo que la Institución sirva de soporte y de puente entre el equipo interdisciplinario, el niño y la familia. El tratamiento del niño es responsabilidad de los padres."},{"s":"11.4.3.5 Responsabilidades, Derechos y Deberes de los","p":91,"t":"• Considerar a los docentes como guías y orientadores del proceso de formación, guardándoles respeto y la confianza que se merecen. • Proporcionarle en casa la atención y el cuidado necesario cuando el niño se encuentre enfermo y no enviarlo al Colegio por su bienestar y precaución. • No enviar a los niños con joyas, juguetes u otros objetos a menos que sean requeridos por el docente. • Respetar al personal docente y demás empleados del Colegio, al igual que las decisiones de los Directivos y las normativas ya establecidas como currículo, horario, uniformes, pedagogía etc. • Avisar y autorizar a la docente de disciplina y/o la coordinadora cuando personas diferentes a los padres recojan a los niños en el colegio. • Responder de inmediato por los daños que ocasionen sus hijos en el colegio. • En los casos de la no asistencia del estudiante a la Institución, y tener el derecho a recuperar las notas que se generen durante su ausencia, deben:"},{"s":"11.4.3.5 Responsabilidades, Derechos y Deberes de los","p":91,"t":"• Notificarlo al colegio por medio escrito con anticipación para evitar que se le generen malas notas por no presentar sus obligaciones escolares durante su asistencia. • Al momento de regresar a clases debe estar al día en las labores realizadas durante su ausencia para ser revisadas por todos y cada uno de los docentes. • Los padres o acudientes son los responsables de ponerlos al día durante su ausencia. No es responsabilidad de los docentes dicha labor, ni adelantarlos, ni entregar anticipadamente trabajos, ni tareas que se realizaran durante la ausencia. • Asistir a las reuniones programadas por la institución y a las citaciones que sean necesarias para el conocimiento del desempeño y formación de sus hijos, recordando que “la ausencia reiterada de los padres a las citaciones que hace el colegio, en este caso la institución los reportará a las autoridades competentes como ICBF, Policía de Infancia y Adolescencia, o cualquier otra entidad que deba conocer de estos casos” como lo contempla la normatividad vigente en el país."},{"s":"11.4.3.6 Responsabilidades, derechos y responsabilidades","p":91,"t":"de los Estudiantes de la Institución a. De las responsabilidades de los estudiantes La Constitución Política de Colombia, Art. 67, considera que, el derecho a la educación, es un “derecho – deber”, que da derecho y exige obligaciones a todos los participantes del proceso educativo. Entre los deberes fundamentales de los estudiantes están: • Asumir las normas de convivencia social. • Demostrar un rendimiento académico acorde con las exigencias Institucionales. • Cumplir con todo lo reglamentado en el Manual de convivencia Institucional. El incumplimiento de estos deberes permite al colegio adoptar las medidas pertinentes, teniendo en cuenta el debido proceso. El derecho a la educación no se vulnera si la institución establece normas de rendimiento académico y actúa de conformidad con ellas. Los alumnos y alumnas del establecimiento, deben adoptar un comportamiento de acuerdo con el Perfil del estudiante establecido en el Proyecto Educativo que ofrece la institución PEI y las orientaciones propuestas en el manual de Convivencia Escolar."},{"s":"11.6.1.3. Responsabilidades, Derechos y Deberes del Rector de la Institución","p":92,"t":"Educativa c. Responsabilidades del Rector (a) de la Institución Ley 1620/2013, Art. 18, además de las que establece normatividad vigente y que le son propias, tendrá las siguientes responsabilidades: • Liderar el comité escolar de convivencia acorde con lo estipulado en los artículos 11, 12 y 13 de la ley en mención. • Incorporar en los procesos de planeación institucional el desarrollo de los componentes de prevención y de promoción, y los protocolos o procedimientos establecidos para la implementación de la ruta de atención integral para la convivencia escolar. • Liderar la revisión y ajuste del proyecto educativo institucional, el manual de convivencia, y el sistema institucional de evaluación anualmente, en un proceso participativo que involucre a los estudiantes y en general a la comunidad educativa, en el marco del Plan de Mejoramiento Institucional. • Reportar aquellos casos de acoso y violencia escolar y vulneración de derechos sexuales y reproductivos de los niños, niñas y adolescentes del establecimiento educativo, en su calidad de presidente del comité escolar de convivencia, acorde con la normatividad vigente y los protocolos definidos en la Ruta de Atención Integral y hacer seguimiento a dichos casos."},{"s":"11.6.1.3. Responsabilidades, Derechos y Deberes del Rector de la Institución","p":92,"t":"d. Derechos y deberes del Rector (a) de la Institución Son derechos y deberes del rector (a) de la institución los establecidos por la normatividad vigente y los definidos en el Manual de Funciones del Sistema de Gestión de Calidad de la Institución Educativa LICEO PAOLA."},{"s":"11.6.1.4. Responsabilidades, Derechos y Deberes de los Docentes de la Institución","p":93,"t":"d. Responsabilidades de los docentes de la institución Ley 1620/2013, Art. 19, además de las que establece la normatividad vigente y que le son propias, tendrán las siguientes responsabilidades: • Identificar, reportar y realizar el seguimiento a los casos de acoso escolar, violencia escolar y vulneración de derechos sexuales y reproductivos que afecten a estudiantes del establecimiento educativo, acorde con los artículos 11 y 12 de la Ley 1146 de 2007 y demás normatividad vigente, con el Manual de Convivencia y con los protocolos definidos en la Ruta de Atención Integral para la Convivencia Escolar. • Si la situación de intimidación de la que tienen conocimiento se hace a través de medios electrónicos, igualmente deberá reportar al comité de convivencia para activar el protocolo respectivo. • Transformar las prácticas pedagógicas para contribuir a la construcción de ambientes de aprendizajes democráticos y tolerantes que potencien la participación, la construcción colectiva de estrategias para la resolución de conflictos, el respeto a la dignidad humana, a la vida, a la integridad física y moral de los estudiantes."},{"s":"11.6.1.4. Responsabilidades, Derechos y Deberes de los Docentes de la Institución","p":93,"t":"• Participar de los procesos de actualización y de formación docente y de evaluación del clima escolar del establecimiento educativo. • Contribuir a la Construcción y Aplicación del Manual de Convivencia. e. Derechos de los docentes de la institución Son derechos de los docentes de la institución Educativa LICEO PAOLA • Las contempladas en la normatividad legal vigente. • Al respeto por su dignidad, identidad, diferencias étnicas, religiosas sin que el proselitismo perjudique el bien común. • A un ambiente de trabajo propicio para el desarrollo de su labor profesional. • A los bienes y recursos necesarios para desempeñar su labor. • A participar directamente o a través de sus representantes en los diversos organismos de la Institución Educativa en la planeación, realización y evaluación del proceso educativo, a elegir y ser elegido para dichos organismos. • A recibir atención respetuosa, amable y sincera de diálogo por parte de los estamentos de la comunidad educativa."},{"s":"11.6.1.4. Responsabilidades, Derechos y Deberes de los Docentes de la Institución","p":94,"t":"• A la libre y respetuosa expresión de conceptos y opiniones. • A la posibilidad de acudir y ser escuchado por instancias superiores de autoridad, siguiendo los conductos regulares de comunicación establecida. • A un proceso de seguimiento y evaluación profesional orientado al mejoramiento continuo. • A participar en planes y programas de capacitación profesional. • A recibir oportunamente los pagos o reconocimientos contractuales legales. • A recibir información oportuna. • A que se acepten incapacidades de entidades reconocidas a nivel nacional. f. Deberes de los docentes de la institución Un docente del LICEO PAOLA debe desarrollar y guiar el aprendizaje de los estudiantes asumiendo todas las responsabilidades que el ejercicio de la pedagogía moderna demanda y el compromiso de afianzar en ellos, los valores y actitudes necesarios para poder convivir y desarrollar sus potencialidades plenamente. Debe:"},{"s":"11.6.1.4. Responsabilidades, Derechos y Deberes de los Docentes de la Institución","p":94,"t":"• Incentivar el amor y respeto por la Institución y todos sus estamentos velando siempre por el buen nombre del Establecimiento Educativo • Cuidar los recursos físicos, didácticos e institucionales. • Las obligaciones adquiridas con otras instituciones no deben interferir los compromisos contraídos con el Establecimiento Educativo. • Corresponder con actitud positiva las oportunidades de formación y capacitación prof
