. 87 de la Ley 115/1994, el cual demanda que los establecimientos educativos tendrán un reglamento o manual de convivencia, en el cual se definan los derechos y obligaciones de los miembros de la comunidad educativa; determina, además, que los padres o tutores y los educandos al firmar la matrícula correspondiente en representación de sus hijos, estarán aceptando el mismo."},{"s":"8.2. Objetivos del Manual de Convivencia","p":36,"t":"La Ley 1620/2013 en su Art. 21 establece que el manual de convivencia es el fundamento para la formación en el desarrollo de competencias para vivir en sociedad; es una norma de carácter legal, ético y moral por la que debe regirse la comunidad educativa con el fin de proveer y garantizar a la comunidad educativa de los principios reguladores de convivencia, procedimentales, culturales y de solidaridad como una ruta para alcanzar los objetivos contemplados en la Ley 115 de 1994, el Decreto 1860 de 1994 y en marco del Sistema Nacional de Convivencia Escolar y Formación para los Derechos Humanos, la Educación para la Sexualidad y la Prevención y Mitigación de la Violencia Escolar, por tanto la institución educativa deberá tener presente que sus objetivos son:"},{"s":"8.2.1. Establecer las definiciones, principios y responsabilidades que para todos los","p":36,"t":"miembros de la comunidad educativa establece la Ley 1620 de 2013, los cuales servirán de base para que dentro del mismo manual se desarrollen los componentes de promoción, prevención, atención y seguimiento de la Ruta de Atención Integral para la Convivencia Escolar"},{"s":"8.2.2. Asegurar la aplicación de los principios que rigen el Proyecto Educativo Institucional","p":36,"t":"en concordancia con las normas legales pertinentes, garantizar el debido proceso a los miembros de la comunidad educativa y regular las relaciones de convivencia como herramienta educativa y pedagógica que garantice el ejercicio y cumplimiento de sus deberes y derechos"},{"s":"8.2.3. Definir la ruta institucional de atención integral que garantice un manejo oportuno y","p":36,"t":"adecuado de los conflictos y conductas que afecten la convivencia escolar, los derechos humanos, sexuales y reproductivos, y la participación de la familia de que trata el artículo 22 de la Ley 1620 de 2013, basado en una perspectiva de fomento, prevención y atención de los mismos."},{"s":"8.2.4. Servir de material de consulta y reflexión permanente para promover la academia, la","p":37,"t":"autorregulación y la formación integral de los miembros de la comunidad educativa dentro de un clima organizacional bajo el paradigma de la responsabilidad y de la corresponsabilidad."},{"s":"8.2.5. Identificar nuevas formas y alternativas para incentivar y fortalecer la convivencia","p":37,"t":"escolar y el ejercicio de los derechos humanos, sexuales y reproductivos de los estudiantes, que permitan aprender del error, respetar la diversidad y dirimir los conflictos de manera pacífica, así como de posibles situaciones y conductas que atenten contra el ejercicio de sus derechos."},{"s":"8.3. Referentes legales pertinentes","p":37,"t":"Entre la normatividad legal pertinente que se articula y/o que se encuentra relacionada con este manual de convivencia y han servido de marco de referencia para su construcción, actualización y aplicación se encuentran: • Ley 2277 de 1979. Estatuto Docente. Por el cual se adoptan normas sobre el ejercicio de la profesión docente • Ley 115 de 1994. Ley General de Educación. Por la cual se expide la ley general de educación • Decreto 1860 de 1994. Por el cual se reglamenta parcialmente la Ley 115 de 1994, en los aspectos pedagógicos y organizativos generales. • Decreto 1108 de 1994: Consumo de sustancias psicotrópicas en menores de edad y niñas embarazadas • Ley 397 de 1997. Ley General de Cultura. Por la cual se dictan normas sobre patrimonio cultural, fomentos y estímulos a la cultura • Ley 715 de 2001. Sistema General de Participaciones. Por la cual se dictan normas orgánicas en materia de recursos y competencias de conformidad con los artículos 151, 288, 356 y 357 (Acto Legislativo 01 de 2001) de la Constitución Política y se dictan otras disposiciones para organizar la prestación de servicios de educación y salud, entre otros."},{"s":"8.3. Referentes legales pertinentes","p":37,"t":"• Decreto 1278 de 2002. Estatuto de Profesionalización Docente. Por el cual se expide el Estatuto de Profesionalización Docente. • Ley 734 de 2002. Código Disciplinario Único. Por la cual se expide el Código Disciplinario Único. • Decreto 1278 de 2002. Por el cual se expide el Estatuto de Profesionalización Docente. • Decreto 1850 de 2002. Por el cual se reglamenta la organización de la jornada escolar y la jornada laboral • Decreto 1286 de 2005: Por el cual se establecen normas sobre la participación de los padres de familia en el mejoramiento de los procesos educativos de los establecimientos. • Resolución MEN 1515/2003. Lineamientos para el proceso de matrícula • Ley 1098 de 2006. Código del Menor. Por la cual se expide el Código de la Infancia y la Adolescencia • Decreto 3782 de 2007: \"Por el cual se reglamenta la evaluación anual de desempeño laboral de los servidores públicos docentes y directivos docentes que se rigen por el Decreto Ley 1278 de 2002\""},{"s":"8.3. Referentes legales pertinentes","p":38,"t":"• Decreto 2715 de 2009 : Por el cual se reglamenta la evaluación de competencias para docentes y directivos docentes regidos por el Decreto Ley 1278 de 2002 y se dictan otras disposiciones. • Decreto 1290 de 2009: Por el cual se reglamenta la evaluación del aprendizaje y promoción de los estudiantes de los niveles de educación básica y media. • Decreto 2968 de agosto de 2010. Por el cual se crea la Comisión Nacional intersectorial para la Promoción y Garantía de los Derechos Sexuales y Reproductivos • Ley 1453 de 2011. Por medio de la cual se reforma el Código Penal, el Código de Procedimiento Penal, el Código de Infancia y Adolescencia, las reglas sobre extinción de dominio y se dictan otras disposiciones en materia de seguridad. • Decreto 1704 de 2012; decreto reglamentario de la ley 1453 de 2011. • Ley estatutaria 1581 de 2012. Por la cual se dictan disposiciones generales para la protección de datos personales"},{"s":"8.3. Referentes legales pertinentes","p":38,"t":"• Decreto 1377 de 2013. Por el cual se reglamenta parcialmente la Ley 1581 de 2012. • Ley 1620 de 2013. por la cual se crea el Sistema Nacional de Convivencia Escolar y Formación para el Ejercicio de los Derechos Humanos, la Educación para la Sexualidad y la Prevención y Mitigación de la Violencia Escolar. • Decreto 1965 de 2013. \"Por el cual se reglamenta la Ley 1620 de 2013, que crea el Sistema Nacional de Convivencia Escolar y Formación para el Ejercicio de los Derechos Humanos, la Educación para la Sexualidad y la Prevención y Mitigación de la Violencia Escolar\" • Ley 2354 de 2024. Vapeadores • Decreto 0459 de 2024. Familia y escuelas • Ley 2365 de 2024. Prevención y protección contra el acoso sexual. • Ley 2383 de 2024. Educación socioemocional • Ley 2170 de 2021. Celulares."},{"s":"8.4.1. Conceptos y definiciones","p":38,"t":"En marco de lo dispuesto en el Art. 2 de la Ley 1620/2013 y el Art. 39 del Decreto 1965/2013, se define y se entiende como: • Acoso escolar o bullying: Conducta negativa, intencional metódica y sistemática de agresión, intimidación, humillación, ridiculización, difamación, coacción, aislamiento deliberado, amenaza o incitación a la violencia o cualquier forma de maltrato psicológico, verbal, físico o por medios electrónicos contra un niño, niña, o adolescente, por parte de un estudiante o varios de sus pares con quienes mantiene una relación de poder asimétrica, que se presenta de forma reiterada o a lo largo de un tiempo determinado. También puede ocurrir por parte de docentes contra estudiantes, o por parte de estudiantes contra docentes, ante la indiferencia o complicidad de su entorno. El acoso escolar tiene consecuencias sobre la salud, el bienestar emocional y el rendimiento escolar de los estudiantes y sobre el ambiente de aprendizaje y el clima escolar del establecimiento educativo."},{"s":"8.4.1. Conceptos y definiciones","p":39,"t":"• Agresión escolar: Es toda acción realizada por uno o varios integrantes de la comunidad educativa que busca afectar negativamente a otros miembros de la comunidad educativa, de los cuales por lo menos uno es estudiante. La agresión escolar puede ser física, verbal, gestual, relacional y electrónica. • Agresión física. Es toda acción que tenga como finalidad causar daño al cuerpo o a la salud de otra persona. Incluye puñetazos, patadas, empujones, cachetadas, mordiscos, rasguños, pellizcos, jalón de pelo, entre otras. • Agresión gestual. Es toda acción que busque con los gestos degradar, humillar, atemorizar o descalificar a otros. • Agresión relacional. Es toda acción que busque afectar negativamente las relaciones que otros tienen. Incluye excluir de grupos, aislar deliberadamente y difundir rumores • secretos buscando afectar negativamente el estatus o imagen que tiene la persona frente a otros."},{"s":"8.4.1. Conceptos y definiciones","p":39,"t":"• Agresión electrónica. Es toda acción que busque afectar negativamente a otros a través de medios electrónicos. Incluye la divulgación de fotos o videos íntimos o humillantes en Internet, realizar comentarios insultantes u ofensivos sobre otros a través de redes sociales y enviar correos electrónicos o mensajes de texto insultantes u ofensivos, tanto de manera anónima como cuando se revela la identidad de quien los envía. • Agresión verbal. Es toda acción que busque con las palabras degradar, humillar, atemorizar, descalificar a otros. Incluye insultos, apodos ofensivos, burlas y amenazas. • Autonomía: Los individuos, entidades territoriales e instituciones educativas son autónomos en concordancia con la Constitución Política y dentro de los límites fijados por las leyes, normas y disposiciones. • Ciberbullying o ciberacoso escolar: Forma de intimidación con uso deliberado de tecnologías de información (internet, redes sociales virtuales, telefonía móvil y videojuegos online) para ejercer maltrato psicológico y continuado."},{"s":"8.4.1. Conceptos y definiciones","p":39,"t":"• Clasificación de las situaciones. Las situaciones que afectan la convivencia escolar y el ejercicio de los derechos humanos, sexuales y reproductivos, se clasifican en tres tipos: I. Situaciones Tipo l. Corresponden a este tipo los conflictos manejados inadecuadamente y aquellas situaciones esporádicas que inciden negativamente en el clima escolar, y que en ningún caso generan daños al cuerpo o a la salud. II. Situaciones Tipo II. Corresponden a este tipo las situaciones de agresión escolar, acoso escolar (bullying) y ciberacoso (Ciberbullying), que no revistan las características de la comisión de un delito y que cumplan con cualquiera de las siguientes características: ▪ Que se presenten de manera repetida o sistemática. ▪ Que causen daños al cuerpo o a la salud sin generar incapacidad alguna para cualquiera de los involucrados. III. Situaciones Tipo III o faltas gravísimas. Corresponden a este tipo las situaciones de conducta o comportamiento que atente contra la integridad física o psicológica de los integrantes de la comunidad educativa, agresiones sostenidas en el tiempo y conductas tipificadas como delito; agresión escolar que sean constitutivas de presuntos delitos contra la libertad, integridad y formación sexual, referidos en el Título IV del Libro 11 de la Ley 599 de 2000, o cuando constituyen cualquier otro delito establecido en la ley penal colombiana vigente."},{"s":"8.4.1. Conceptos y definiciones","p":40,"t":"• Competencias ciudadanas: Es una de las competencias básicas que se define como el conjunto de conocimientos y de habilidades cognitivas, emocionales y comunicativas que, articulados entre sí, hacen posible que el ciudadano actúe de manera constructiva en una sociedad democrática. • Conflictos: Son situaciones que se caracterizan porque hay una incompatibilidad real o percibida entre una o varias personas frente a sus intereses. • Conflictos manejados inadecuadamente: Son situaciones en las que los conflictos no son resueltos de manera constructiva y dan lugar a hechos que afectan la convivencia escolar, como altercados, enfrentamientos o riñas entre dos o más miembros de la comunidad educativa de los cuales por lo menos uno es estudiante y siempre y cuando no exista una afectación al cuerpo o a la salud de cualquiera de los involucrados. • Corresponsabilidad. La familia, los establecimientos educativos, la sociedad y el Estado son corresponsables de la formación ciudadana, la promoción de la convivencia escolar, la educación para el ejercicio de los derechos humanos, sexuales y reproductivos de los niños, niñas y adolescentes desde sus respectivos ámbitos de acción, en torno a los objetivos del Sistema y de conformidad con lo consagrado en el artículo 44 de la Constitución Política y el Código de la Infancia y la Adolescencia."},{"s":"8.4.1. Conceptos y definiciones","p":41,"t":"• Diversidad: El Sistema se fundamenta en el reconocimiento, respeto y valoración de la dignidad propia y ajena, sin discriminación por razones de género, orientación o identidad sexual, etnia o condición física, social o cultural. Los niños, niñas y adolescentes tienen derecho a recibir una educación y formación que se fundamente en una concepción integral de la persona y la dignidad humana, en ambientes pacíficos, democráticos e incluyentes. • Educación para el ejercicio de los derechos humanos, sexuales y reproductivos: Es aquella orientada a formar personas capaces de reconocerse como sujetos activos titulares de derechos humanos, sexuales y reproductivos con la cual desarrollarán competencias para relacionarse consigo mismo y con los demás, con criterios de respeto por sí mismo, por el otro y por el entorno, con el fin de poder alcanzar un estado de bienestar físico, mental y social que les posibilite tomar decisiones asertivas, informadas y autónomas para ejercer una sexualidad libre, satisfactoria, responsable y sana en torno a la construcción de su proyecto de vida y a la transformación de las dinámicas sociales, hacia el establecimiento de relaciones más justas, democráticas y responsables."},{"s":"8.4.1. Conceptos y definiciones","p":41,"t":"• Integralidad: La filosofía del sistema será integral y estará orientada hacia la promoción de la educación para la autorregulación del individuo, de la educación para la sanción social y de la educación en el respeto a la Constitución y las leyes. • Participación. En virtud de este principio las entidades y establecimientos educativos deben garantizar su participación activa para la coordinación y armonización de acciones, en el ejercicio de sus respectivas funciones, que permitan el cumplimiento de los fines del Sistema. Al tenor de la Ley 115 de 1994 y de los artículos 31, 32, 43 y 44 de la Ley 1098 de 2006, los establecimientos Implementar mecanismos de prevención y mecanismos de mitigación y prevención educativos deben garantizar el derecho a la participación de niños, niñas y adolescentes en el desarrollo de las estrategias y acciones que se adelanten dentro de los mismos en el marco del Sistema. En armonía con los artículos 113 y 288 de la Constitución Política, los diferentes estamentos estatales deben actuar en el marco de la coordinación, concurrencia, complementariedad y subsidiariedad; respondiendo a sus funciones misionales."},{"s":"8.4.1. Conceptos y definiciones","p":41,"t":"• Restablecimiento de los derechos de los niños, niñas y adolescentes: Es el conjunto de actuaciones administrativas y de otra naturaleza, que se desarrollan para la restauración de su dignidad e integridad como sujetos de derechos, y de su capacidad para disfrutar efectivamente de los derechos que le han sido vulnerados. • Ruta de Atención Integral para la Convivencia Escolar. Se refiere a los procesos y los protocolos que deberán seguir las entidades e instituciones que conforman el Sistema Nacional de Convivencia Escolar y Formación para los Derechos Humanos, la Educación para la Sexualidad y la Prevención y Mitigación de la Violencia Escolar, en todos los casos en que se vea afectada la convivencia escolar y los derechos humanos, sexuales y reproductivos de los estudiantes de las instituciones educativas, articulando una oferta de servicio ágil, integral y complementario. • Violencia sexual. Se entiende por violencia sexual contra niños, niñas y adolescentes todo acto o comportamiento de tipo sexual ejercido sobre un niño, niña o adolescente, utilizando la fuerza o cualquier forma de coerción física, psicológica o emocional, aprovechando las condiciones de indefensión, de desigualdad y las relaciones de poder existentes entre víctima y agresor\"."},{"s":"8.4.1. Conceptos y definiciones","p":42,"t":"• Vulneración de los derechos de los niños, niñas y adolescentes: Es toda situación de daño, lesión o perjuicio que impide el ejercicio pleno de los derechos de los niños, niñas y adolescentes."},{"s":"8.4.2. Constitución Política de Colombia","p":42,"t":"La Constitución Política de Colombia, en su Artículo 67, establece que “la educación es un derecho de la persona y un servicio público que tiene una función social; con ella se busca el acceso al conocimiento, a la ciencia, a la técnica, y a los demás bienes y valores de la cultura. a. La educación formará al colombiano en el respeto a los derechos humanos, a la paz y a la democracia; y en la práctica del trabajo y la recreación, para el mejoramiento cultural, científico, tecnológico y para la protección del ambiente. b. El Estado, la sociedad y la familia son responsables de la educación, que será obligatoria entre los cinco y los quince años de edad y que comprenderá como mínimo, un año de preescolar y nueve de educación básica…”"},{"s":"8.4.3. Ley General de Educación y Decretos Reglamentarios","p":42,"t":"La Ley General de Educación o Ley 115/1994, en sus Art. 73 y 87, así como en el Art 17 del Decreto 1860/1994, describen que en el Proyecto Educativo Institucional - PEI y el Reglamento o Manual de Convivencia se deben definir los derechos y obligaciones de los estudiantes y señala las condiciones de matrícula para los estudiantes, y los compromisos de los Padres y/o Acudientes. Su aceptación es obligatoria al momento de la matrícula o renovación de la misma."},{"s":"8.4.4. Ley Marco del Sistema Nacional de Convivencia Escolar y Formación para los","p":42,"t":"Derechos Humanos, la Educación para la Sexualidad y la Prevención y Mitigación de la Violencia Escolar • Ley 1620/2013 El Art. 21 de la Ley 1620/2013, determina que en marco del Sistema Nacional de Convivencia Escolar y Formación para los Derechos Humanos, la Educación para la Sexualidad y la Prevención y Mitigación de la Violencia Escolar, y además de lo establecido en el artículo 87 de la Ley 115 de 1994, los manuales de convivencia deben identificar nuevas formas y alternativas para incentivar y fortalecer la convivencia escolar y el ejercicio de los derechos humanos, sexuales y reproductivos de los estudiantes, que permitan aprender del error, respetar la diversidad y dirimir los conflictos de manera pacífica, así como de posibles situaciones y conductas que atenten contra el ejercicio de sus derechos. El manual concederá al educador el rol de orientador y mediador en situaciones que atenten contra la convivencia escolar y el ejercicio de los derechos humanos, sexuales y reproductivos, así como funciones en la detección temprana de estas mismas situaciones, a los estudiantes, el manual les concederá un rol activo para participar en la definición de acciones para el manejo de estas situaciones, en el marco de la ruta de atención integral."},{"s":"8.4.4. Ley Marco del Sistema Nacional de Convivencia Escolar y Formación para los","p":43,"t":"El manual de convivencia deberá incluir la ruta de atención integral y los protocolos de que trata la presente ley. • Acorde con el artículo 87 de la Ley 115 de 1994, el manual de convivencia define los derechos y obligaciones de los estudiantes de cada uno de los miembros de la comunidad educativa, a través de los cuales se rigen las características y condiciones de interacción y convivencia entre los mismos y señala el debido proceso que debe seguir el establecimiento educativo ante el incumplimiento del mismo. • Es una herramienta construida, evaluada y ajustada por la comunidad educativa, con la participación activa de los estudiantes y padres de familia, de obligatorio cumplimiento en los establecimientos educativos públicos y privados y es un componente esencial del proyecto educativo institucional. • El manual de que trata el presente artículo debe incorporar, además de lo anterior, las definiciones, principios y responsabilidades que establece la presente ley, sobre los cuales se desarrollarán los factores de promoción y prevención y atención de la Ruta de Atención Integral para la Convivencia Escolar."},{"s":"8.4.4. Ley Marco del Sistema Nacional de Convivencia Escolar y Formación para los","p":43,"t":"• Del Decreto 1965/2013 El Art. 29 del Decreto 1965/2013, define los lineamientos generales para que en la actualización del Manual de Convivencia, los establecimientos educativos oficiales y no oficiales se aseguren de incluir en ellos, como mínimo, los aspectos relacionados con: • Las situaciones más comunes que afectan la convivencia escolar y el ejercicio de los derechos humanos, sexuales y reproductivos, las cuales deben ser identificadas y valoradas dentro del contexto propio del establecimiento educativo. • Las pautas y acuerdos que deben atender todos los integrantes de la comunidad educativa para garantizar la convivencia escolar y el ejercicio de los derechos humanos, sexuales y reproductivos. • La clasificación de las situaciones consagradas el artículo 40 del presente Decreto. • Los protocolos de atención integral para la convivencia escolar de que tratan los artículos 42, 43 y 44 del presente Decreto 1965/2013."},{"s":"8.4.4. Ley Marco del Sistema Nacional de Convivencia Escolar y Formación para los","p":44,"t":"• Las medidas pedagógicas y las acciones que contribuyan a la promoción de la convivencia escolar, a la prevención de las situaciones que la afectan y a la reconciliación, la reparación de los daños causados y el restablecimiento de un clima de relaciones constructivas en el establecimiento educativo cuando estas situaciones ocurran. • Las estrategias pedagógicas que permitan y garanticen la divulgación y socialización de los contenidos del manual de convivencia a la comunidad educativa, haciendo énfasis en acciones dirigidas a los padres y madres de familia o acudientes. El Art. 54 del Decreto 1965/2013, en relación con la Participación de la Sociedad, determina que los establecimientos educativos en el marco del proyecto educativo institucional deberán revisar y ajustar el manual de convivencia y dar plena aplicación a los principios de participación, corresponsabilidad, autonomía, diversidad e integralidad que establece el Art. 21 de la Ley 1620 de 2013, y acorde con lo formulado en la Ley 115 de 1994 y en el Decreto 1860 de 1994, el manual de convivencia escolar deberá ser construido, evaluado y ajustado por la comunidad educativa integrada por los estudiantes, padres y madres de familia, docentes y directivos docentes, bajo la coordinación del comité escolar de convivencia."},{"s":"8.4.4. Ley Marco del Sistema Nacional de Convivencia Escolar y Formación para los","p":44,"t":"Por lo anterior la institución educativa deberá involucrarlos en su elaboración y modificación, teniendo en cuenta: • Que la sociedad deberá contribuir al fortalecimiento de la formación para la ciudadanía y el ejercicio de los derechos humanos, sexuales y reproductivos de los estudiantes, y en la prevención y mitigación de la violencia escolar y el embarazo en la adolescencia, en cumplimiento de lo establecido en el artículo 42 de la Constitución Política. En virtud de ello, las organizaciones de la sociedad civil, las asociaciones, las empresas, el comercio organizado, los gremios económicos y demás personas jurídicas, así como las personas naturales deberán cumplir con las obligaciones establecidas en el artículo 8 de la Ley 115 de 1994, en el artículo 40 de la Ley 1098 de 2006, y demás normas reglamentarias y concordantes. • Que la familia como núcleo fundamental de la sociedad es parte esencial del fortalecimiento de la formación para la ciudadanía y el ejercicio de los derechos humanos, sexuales y reproductivos, tiene un papel central en la prevención y mitigación de la violencia escolar y el embarazo en la adolescencia, y le asisten todos"},{"s":"8.4.4. Ley Marco del Sistema Nacional de Convivencia Escolar y Formación para los","p":45,"t":"los deberes, obligaciones y funciones consagradas en el artículo 7 de la Ley 115 de 1994, en el artículo 39 de la Ley 1098 de 2006, en la Ley 1404 de 2010, en el artículo 3 del Decreto 1860 de 1994, en el Decreto 1286 de 2005, en el artículo 15 del Decreto 1290 de 2009 y demás normas concordantes."},{"s":"8.5. Referentes Constitucionales","p":45,"t":"Con la aparición de la figura de la tutela, como instrumento de protección de los derechos fundamentales, a partir de la promulgación de la Constitución Política de Colombia en 1991, la Corte Constitucional, dentro de la función de revisión de los fallos proferidos por instancias judiciales competentes, ha emitido múltiples pronunciamientos en torno a la aplicación de los derechos fundamentales en la prestación del servicio educativo, por parte de las instituciones oficiales y privadas. Dada la trascendencia de estos pronunciamientos, ha considerado fundamental incorporar como parte del Manual de Convivencia, apartes de algunas sentencias producidas, como criterios de observancia, que orienten la debida comprensión y aplicación de los conceptos, procedimientos e instrumentos indicados en el Manual, por parte de los integrantes de la comunidad educativa."},{"s":"8.5.1. Sentencias de la corte constitucional","p":45,"t":"• La Corte Constitucional advirtió que los colegios no están obligados a mantener en las aulas a quienes en forma constante y reiterada desconocen las directrices disciplinarias y académicas. • Esta sala señala que el deber de los estudiantes radica desde el punto de vista disciplinario en respetar el reglamento o manual de convivencia y mantener sanas costumbres. Indicó además que los estudiantes tienen la obligación de mantener las normas de presentación en los colegios, así como los horarios de entrada y salida de clases, recreos, salidas y asistencia y el debido respeto por sus profesores y compañeros: • Sentencia T-478/15. LEGITIMACIÓN POR ACTIVA EN TUTELA DE PADRES DE FAMILIA DE HIJOS FALLECIDOS-Procedencia para la protección del derecho a la dignidad, honra, buen nombre, intimidad, la memoria y la imagen del fallecido • Sentencia T-928/14. PRINCIPIO DE SUBSIDIARIEDAD COMO REQUISITO DE PROCEDIBILIDAD DE LA ACCIÓN DE TUTELA-Reiteración de jurisprudencia"},{"s":"8.5.1. Sentencias de la corte constitucional","p":45,"t":"• Sentencia T-356/13. DERECHO AL LIBRE DESARROLLO DE LA PERSONALIDAD- Inaplicación de las normas del manual de convivencia en lo relacionado con el corte y presentación del cabello • Sentencia T-557/11. PREVALENCIA DE LOS DERECHOS DEL NIÑO-Desarrollo del principio del interés superior del menor • Sentencia T-345/08. DERECHO AL LIBRE DESARROLLO DE LA PERSONALIDAD- Corte de cabello • Sentencia T-688/05. MANUAL DE CONVIVENCIA-No puede vulnerar derechos constitucionales • Sentencia T-435/02. DEBIDO PROCESO-Alcance • Sentencia T-1023/00. DERECHO DE PERMANENCIA EN UN CARGO-No es derecho fundamental • Sentencia T-648/98. ACCIÓN DE TUTELA CONTRA PARTICULARES- Improcedencia por afiliación voluntaria a club social • Sentencia No. T-519/92. Estudiantes indisciplinados. • Sentencia No. T-341/93. Cumplimiento y obligaciones por parte del estudiante. • Sentencia No. T-050/93 y T-594/93. El libre desarrollo de la personalidad."},{"s":"8.5.1. Sentencias de la corte constitucional","p":46,"t":"• Sentencia No. T-092/94. No se vulnera el derecho a la educación por pérdida de año. • Sentencia No. T-316/94. No se vulnera el derecho a la educación por normas de rendimiento y disciplina. • Sentencia No. T-439/94 No se vulnera el derecho a la educación por la exigencia del buen rendimiento. • Sentencia No. T-386/94. REGLAMENTO EDUCATIVO-Límites • Sentencia C-866/01. Revisión de constitucionalidad de apartes de los artículos 87 y 93 de la Ley 115 de 1994. Los establecimientos educativos tendrán un reglamento o manual de convivencia, en el cual se definan los derechos y obligaciones, de los estudiantes. Los padres o tutores y los educandos al firmar la matrícula correspondiente en representación de sus hijos, estarán aceptando el mismo. • Sentencia T-076/23. Elimina vapeadores en menores de edad. • Sentencia T-232/23. Adolescentes con discapacidad, esquizofrenia. • Sentencia T-252/23. Docentes pagan de su bolsillo por omisión en casos de matoneo."},{"s":"8.5.1. Sentencias de la corte constitucional","p":46,"t":"• Sentencia T-004/24. Autonomía escolar y debido proceso. • Sentencia T-082/24. Vivir sin violencia y sin ser victimizada. Violencia de genero. • Sentencia T-303/24. Salud y seguridad, asbesto y calor excesivo. • Sentencia T-330/24. Negar matricula siguiente y debido proceso. • Sentencia T-124/24. Sobre abuso sexual y violencia de genero. • Sentencia T-141/24. Dientes al comité de convivencia laboral. • Sentencia T-154/24. Cultura del NO pago. • Sentencia T-176/24. Matoneo y acoso escolar. • Sentencia T-249/24. Compulsan copias a docentes. • Sentencia T-261/24. Estudiantes transgénero."},{"s":"8.5.2. Alcances del manual de convivencia","p":47,"t":"• “Para la Corte es claro entonces, que la ley asignó a los establecimientos educativos, públicos y privados, un poder de reglamentación dentro del marco de su actividad. Los reglamentos generales de convivencia, como es de la esencia de los actos reglamentarios, obligan a la entidad que los ha expedido y a sus destinatarios, esto es, a quienes se les aplican, porque su fuerza jurídica vinculante deviene en forma inmediata de la propia ley y mediata de la Constitución Política.” (Sentencia T-386 de 1994) • “En otros términos, los reglamentos de las instituciones educativas no podrán contener elementos, normas o principios que estén en contravía de la Constitución vigente como tampoco favorecer o permitir prácticas entre educadores y educandos que se aparten de la consideración y el respeto debidos a la privilegiada condición de seres humanos tales como tratamientos que afecten el libre desarrollo de la personalidad de los educandos, su dignidad de personas nacidas en un país que hace hoy de la diversidad y el pluralismo étnico, cultural y social principio de praxis general. Por tanto, en la relación educativa que se establece entre los diversos sujetos, no podrá favorecerse la presencia de prácticas discriminatorias, los tratos humillantes, las sanciones que no consulten un propósito objetivamente educativo sino el mero capricho y la arbitrariedad.” (Sentencia T-524 de 1992)"},{"s":"8.5.2. Alcances del manual de convivencia","p":47,"t":"• “Si bien es cierto que el Reglamento del plantel educativo es base fundamental orientadora de la disciplina del Colegio, pues sin él no sería posible mantener un nivel de organización, es cierto también que las normas allí contenidas deben ajustarse o mejor interpretarse acorde con las circunstancias particulares de los menores. No se trata de permitir una total libertad, pues esto no contribuye a la formación, pero sí comprender la situación y en la forma más razonable obrar sin perjudicar el futuro del educando.” (Sentencia T-015 de 1994) • “Por consiguiente, los reglamentos internos o manuales de convivencia elaborados por las comunidades de los planteles educativos tienen la obligación de observar las disposiciones constitucionales. En efecto, el respeto al núcleo esencial de los derechos fundamentales de los estudiantes no se disminuye como consecuencia de la facultad otorgada a los centros"},{"s":"8.5.2. Alcances del manual de convivencia","p":48,"t":"educativos para regular el comportamiento de sus alumnos. Por el contrario, las reglas que se establezcan deben reflejar el respeto a la dignidad humana y a la diversidad étnica, cultural y social de la población (artículo 1º), así como los derechos al libre desarrollo de la personalidad (artículo 16), libertad de conciencia (artículo 18), libertad de expresión (artículo 20), igualdad (artículo 13), debido proceso (artículo 29) y educación (artículo 67) superiores. Además de su consagración constitucional, la titularidad de estos derechos se encuentra en cabeza de niños y adolescentes en proceso de formación, lo que implica una protección reforzada. Ello, por supuesto, no significa que en el contexto de la comunidad educativa quienes tienen a su cargo la elaboración de los reglamentos de dichas instituciones, no puedan establecer límites razonables y proporcionales al ejercicio de los derechos. En la medida que los derechos fundamentales no son absolutos, y en ciertos aspectos se enfrentan a valores, principios y otros derechos fundamentales protegidos también por la Carta, la Corte ha sostenido que su alcance y efectividad pueden ser objeto de ponderación y armonización frente a otras disposiciones constitucionales a través de los reglamentos de convivencia.” (Sentencia T-1233 de 2003)"},{"s":"8.5.3. Libertad de enseñanza-titulares/libertad de catedra/personal docente-","p":48,"t":"presentación de programas “Son titulares de la libertad de enseñanza, aprendizaje e investigación la comunidad en general, y en particular las instituciones de enseñanza, sean éstas públicas o privadas, los docentes e investigadores y los estudiantes. Pero la \"libertad de cátedra\", tiene un destinatario único y este es el educador, cualquiera fuese su nivel o su especialidad. Por lo tanto, la libertad de cátedra es el derecho garantizado constitucionalmente a todas las personas que realizan una actividad docente a presentar un programa de estudio, investigación y evaluación que según su criterio, se refleja en el mejoramiento del nivel académico de los educandos. La libertad de cátedra no es un derecho absoluto, sino que tiene un límite constituido por los fines del Estado, entre los cuales se encuentra la protección de los derechos, como la paz, la convivencia y la libertad de conciencia, entre otros. En desarrollo de la libertad de cátedra los planteles educativos -sean públicos o privados, deben permitir que los profesores libremente determinen la forma en que consideran debe desarrollarse la materia y realizarse las evaluaciones, claro está que la decisión debe ser comunicada a las directivas con el fin de velar por la calidad, el cumplimiento en las labores docentes y por la mejor formación intelectual los educandos”. (Sentencia No. T-092/94)"},{"s":"8.5.4. Formación integral del educando","p":48,"t":"“El comportamiento del estudiante en su claustro de estudios, en su hogar y en la sociedad, es algo que obviamente resulta trascendente y vital para los intereses educativos del establecimiento de enseñanza, porque es necesario mantener una interacción enriquecedora y necesaria entre el medio educativo y el ámbito del mundo exterior, lo cual se infiere de la voluntad Constitucional cuando se establece a modo de principio que \"el estado, la sociedad y la familia son responsables de la educación\". Nadie puede negar que las actividades que el estudiante cumple dentro y fuera de su centro de estudios, influyen definitivamente en el desarrollo de su personalidad, en cuanto contribuyen a su formación educativa, a saciar sus necesidades físicas, psíquicas e intelectuales, y a lograr su desarrollo moral, espiritual, social afectivo, ético y cívico, como es la filosofía que inspira la ley general de educación (Ley 115/94, art. 5o.)."},{"s":"8.5.4. Formación integral del educando","p":49,"t":"No obstante, lo anterior, a juicio de la Corte los reglamentos de las instituciones educativas no pueden entrar a regular aspectos que de alguna manera puedan afectar los derechos constitucionales fundamentales de los educandos, pues si ello está vedado a la ley con mayor razón a los reglamentos de la naturaleza indicada. En tal virtud, dichos reglamentos no pueden regular aspectos o conductas del estudiante ajenas al centro educativo que puedan afectar su libertad, su autonomía o su intimidad o cualquier otro derecho, salvo en el evento de que la conducta externa del estudiante tenga alguna proyección o injerencia grave, que directa o indirectamente afecte la institución educativa.” (Sentencia T-386 de 1994) 8.5.5. Del derecho – deber de la educación. • “Ahora bien, una característica de algunos de los derechos constitucionales fundamentales es la existencia de deberes correlativos. En el artículo 95 de la Constitución Política se encuentran los deberes y obligaciones de toda persona. La persona humana además de derechos tienen deberes; ello es como las dos caras de una moneda, pues es impensable la existencia de un derecho sin deber frente a sí mismo y frente a los demás.” (Sentencia 002 de 1992)"},{"s":"8.5.4. Formación integral del educando","p":49,"t":"• “Considera la Corte que quien se matricula en un centro educativo con el objeto de ejercer el derecho constitucional fundamental que lo ampara, contrae por ese mismo hecho obligaciones que debe cumplir, de tal manera que no puede invocar el mentado derecho para excusar las infracciones en que incurra. Por ello, si reclama protección mediante la acción de tutela, alegando que el plantel desconoce las garantías constitucionales al aplicarle una sanción, es imperioso que el juez verifique tanto los actos ejecutados por las autoridades del centro educativo como la conducta observada por el estudiante, a objeto de adoptar una decisión verdaderamente justa en cuya virtud no se permita el quebrantamiento de los derechos constitucionales del educando pero tampoco se favorezca la irresponsabilidad de éste.” (Sentencia T-341 de 1993) • Derecho a la educación/plantel educativo-retiro. “La educación sólo es posible cuando se da la convivencia y si la indisciplina afecta gravemente a ésta última, ha de prevalecer el interés general y se puede, respetando el debido proceso y los otros derechos fundamentales, a más de la participación de la comunidad educativa, llegar hasta a"},{"s":"8.5.4. Formación integral del educando","p":50,"t":"separar a la persona del establecimiento. Además, la permanencia de la persona en el sistema educativo está condicionada por su concurso activo en la labor formativa; la falta de rendimiento intelectual también puede llegar a tener suficiente entidad como para que la persona sea retirada del establecimiento donde debía aprender y no lo logra por su propia causa”. (Sentencia No. T-316/94). • Derecho a la educación-faltas disciplinarias/derechos fundamentales. “Tanto el derecho a educarse como la libertad de aprendizaje, enseñanza, investigación y cátedra son derechos fundamentales de los que no puede ser privado individuo alguno sin quebrantar los principios y mandatos constitucionales. Si bien la educación es un derecho fundamental y el estudiante debe tener la posibilidad de permanecer vinculado al plantel hasta la culminación de sus estudios, de allí no puede colegirse que el centro docente esté obligado a mantener indefinidamente entre sus discípulos a quien de manera constante y reiterada desconoce las directrices disciplinarias y quebranta el orden impuesto por el reglamento educativo”. (Sentencia No. T-519/92)."},{"s":"8.5.4. Formación integral del educando","p":50,"t":"8.5.6. Disciplina escolar. • “La aplicación de la disciplina en el establecimiento educativo no implica de suyo la violación de derechos fundamentales. Pero los profesores y directivas están obligados a respetar la dignidad del estudiante. La Corte Constitucional insiste en que toda comunidad requiere de un mínimo de orden y del imperio de la autoridad para que pueda subsistir en ella una civilizada convivencia, evitando el caos que podría generarse si cada individuo, sin atender reglas ni preceptos, hiciera su absoluta voluntad, aun en contravía de los intereses comunes, en un mal entendido concepto del derecho al libre desarrollo de la personalidad.”. (Sentencia T-366 de 1992) • \"La disciplina, que es indispensable en toda organización social para asegurar el logro de sus fines dentro de un orden mínimo, resulta inherente a la educación, en cuanto hace parte insustituible de la formación del individuo. Pretender que, por una errónea concepción del derecho al libre desarrollo de la personalidad, las instituciones educativas renuncien a exigir de sus alumnos comportamientos acordes con un régimen disciplinario al que están obligados desde su ingreso, equivale a contrariar los objetivos propios de la función formativa que cumple la educación\". (Sentencia 037 de 1995)"},{"s":"8.5.4. Formación integral del educando","p":50,"t":"8.5.7. Concurrencia de los padres de familia. “El proceso educativo exige no solamente el cabal y constante ejercicio de la función docente y formativa por parte del establecimiento, sino la colaboración del propio alumno y el concurso de sus padres o acudientes. Estos tienen la obligación, prevista en el artículo 67 de la Constitución, de concurrir a la formación moral, intelectual y física del menor y del adolescente, pues \"el Estado, la sociedad y la familia son responsables de la educación\". No contribuye el padre de familia a la formación de la personalidad ni a la estructuración del carácter de su hijo cuando, so pretexto de una mal entendida protección paterna -que en realidad significa cohonestar sus faltas-, obstruye la labor que adelantan los educadores cuando lo corrigen, menos todavía si ello se refleja en una actitud agresiva e irrespetuosa.” (Sentencia T-"},{"s":"8.5.8. Debido proceso","p":51,"t":"“En diversas oportunidades, esta Corporación ha señalado que la garantía constitucional al debido proceso (artículo 29 Superior) tiene aplicación en los procesos disciplinarios adelantados por los centros educativos de naturaleza pública y privada. En virtud de ello, la imposición de una sanción disciplinaria debe estar precedida del agotamiento de un procedimiento justo y adecuado, en el cual el implicado haya podido participar, presentar su defensa y controvertir las pruebas presentadas en su contra.” Según las cortes, el derecho a la educación, no es un derecho a la promoción automática ni a la permanencia en la institución. Tanto la promoción como la permanencia dependen del cumplimiento de las condiciones académicas y reglamentarias consagradas en el PEI y el Manual de Convivencia. (Sentencia T-1233 de 2003)"},{"s":"8.6. Sistema nacional de convivencia escolar y formación para los derechos","p":51,"t":"humanos, la educación para la sexualidad y la prevención y mitigación de la violencia escolar 8.6.1. Objetivos del sistema nacional de convivencia escolar. El Art. 4 de la Ley 1620/2013 establece que son objetivos del Sistema Nacional de Convivencia Escolar y Formación para los Derechos Humanos, la Educación para la Sexualidad y la Prevención y Mitigación de la Violencia Escolar: • Fomentar, fortalecer y articular acciones de diferentes instancias del Estado para la convivencia escolar, la construcción de ciudadanía y la educación para el ejercicio de los derechos humanos, sexuales y reproductivos de los niños, niñas y adolescentes de los niveles educativos de preescolar, básica y media. • Garantizar la protección integral de los niños, niñas y adolescentes en los espacios educativos, a través de la puesta en marcha y el seguimiento de la ruta de atención integral para la convivencia escolar, teniendo en cuenta los contextos sociales y culturales particulares."},{"s":"8.6. Sistema nacional de convivencia escolar y formación para los derechos","p":52,"t":"• Fomentar y fortalecer la educación en y para la paz, las competencias ciudadanas, el desarrollo de la identidad, la participación, la responsabilidad democrática, la valoración de las diferencias y el cumplimiento de la ley, para la formación de sujetos activos de derechos. • Promover el desarrollo de estrategias, programas y actividades para que las entidades en los diferentes niveles del Sistema y los establecimientos educativos fortalezcan la ciudadanía activa y la convivencia pacífica, la promoción de derechos y estilos de vida saludable, la prevención, detección, atención y seguimiento de los casos de violencia escolar, acoso escolar o vulneración de derechos sexuales y reproductivos e incidir en la prevención y mitigación de los mismos, en la reducción del embarazo precoz de adolescentes y en el mejoramiento del clima escolar. • Fomentar mecanismos de prevención, protección, detección temprana y denuncia de todas aquellas conductas que atentan contra la convivencia escolar, la ciudadanía y el ejercicio de los derechos humanos, sexuales y reproductivos de los estudiantes de preescolar, básica y media, particularmente, las relacionadas con acoso escolar y violencia escolar incluido el que se pueda generar a través del uso de la internet, según se defina en la ruta de atención integral para la convivencia escolar."},{"s":"8.6. Sistema nacional de convivencia escolar y formación para los derechos","p":52,"t":"• Identificar y fomentar mecanismos y estrategias de mitigación de todas aquellas situaciones y conductas generadoras de situaciones de violencia escolar. • Orientar estrategias y programas de comunicación para la movilización social, relacionadas con la convivencia escolar, la construcción de ciudadanía y la promoción de los derechos humanos, sexuales y reproductivos. • Contribuir a la prevención del embarazo en la adolescencia y a la reducción de enfermedades de transmisión sexual. 8.6.2. Principios del sistema nacional de convivencia escolar. La Ley 1620/2013, en su Art 5, define que son principios del Sistema Nacional de Convivencia Escolar y Formación para los Derechos Humanos, la Educación para la Sexualidad y la Prevención y Mitigación de la Violencia Escolar. • Participación. En virtud de este principio las entidades y establecimientos educativos deben garantizar su participación activa para la coordinación y armonización de acciones, en el ejercicio de sus respectivas funciones, que permitan el cumplimiento de los fines del Sistema. Al tenor de la Ley 115 de 1994 y de los artículos 31, 32, 43 y 44 de la Ley 1098 de 2006, los establecimientos educativos deben garantizar el derecho a la"},{"s":"8.6. Sistema nacional de convivencia escolar y formación para los derechos","p":53,"t":"participación de niños, niñas y adolescentes en el desarrollo de las estrategias y acciones que se adelanten dentro de los mismos en el marco del Sistema. En armonía con los artículos 113 y 288 de la Constitución Política, los diferentes estamentos estatales deben actuar en el marco de la coordinación, concurrencia, complementariedad y subsidiariedad; respondiendo a sus funciones misionales. • Corresponsabilidad. La familia, los establecimientos educativos, la sociedad y el Estado son corresponsables de la formación ciudadana, la promoción de la convivencia escolar, la educación para el ejercicio de los derechos humanos, sexuales y reproductivos de los niños, niñas y adolescentes desde sus respectivos ámbitos de acción, en torno a los objetivos del Sistema y de conformidad con lo consagrado en el artículo 44 de la Constitución Política y el Código de la Infancia y la Adolescencia. • Autonomía: Los individuos, entidades territoriales e instituciones educativas son autónomos en concordancia con la Constitución Política y dentro de los límites fijados por las leyes, normas y disposiciones."},{"s":"8.6. Sistema nacional de convivencia escolar y formación para los derechos","p":53,"t":"• Diversidad: El Sistema se fundamenta en el reconocimiento, respeto y valoración de la dignidad propia y ajena, sin discriminación por razones de género, orientación o identidad sexual, etnia o condición física, social o cultural. Los niños, niñas y adolescentes tienen derecho a recibir una educación y formación que se fundamente en una concepción integral de la persona y la dignidad humana, en ambientes pacíficos, democráticos e incluyentes. • Integralidad: La filosofía del sistema será integral y estará orientada hacia la promoción de la educación para la autorregulación del individuo, de la educación para la sanción social y de la educación en el respeto a la Constitución y las leyes. 8.6.3. Estructura del sistema nacional de convivencia escolar. La Ley 1620/2013, en su Art 6, define que los niveles de estructura del Sistema Nacional de Convivencia Escolar y Formación para los Derechos Humanos, la Educación para la Sexualidad y la Prevención y Mitigación de la Violencia Escolar. (…) tendrá una estructura constituida por instancias en tres niveles, liderados por el sector educativo:"},{"s":"8.6. Sistema nacional de convivencia escolar y formación para los derechos","p":53,"t":"• Nacional: Integrado por el Comité Nacional de Convivencia Escolar. • Territorial: Integrado por los comités municipales, distritales y departamentales de convivencia escolar, según corresponda. • Escolar: Integrado por el comité de convivencia del respectivo establecimiento educativo."},{"s":"9.1. Matrícula","p":54,"t":"La matrícula es el registro o inscripción de los estudiantes que realizarán sus estudios en un establecimiento educativo, lo que conlleva el trámite de las solicitudes de cupos escolares y la formalización del ingreso de estudiantes a la institución, lo que se considera como un proceso básico organizacional en las gestiones que realizan las instituciones educativas. La matrícula es el acto que normaliza la vinculación del educando al servicio educativo, pudiéndose establecer renovaciones por cada periodo académico. Sobre este particular el Art. 3 del Decreto 1286/2005 establece que es deber de los padres de familia matricular a sus hijos y realizar todos los procesos establecidos por el establecimiento educativo. La Ley 115/1994, en su Art. 95, se define que la matrícula es el acto que formaliza la vinculación del educando al servicio educativo. Se realizará por una sola vez, al ingresar el alumno a un establecimiento educativo, pudiéndose establecer renovaciones para cada período académico; así mismo, en el Art. 201 se establece los establecimientos educativos privados podrán renovar la matrícula de los alumnos o educandos para cada período académico, mediante contrato que se regirá por las reglas del derecho privado. El contrato deberá establecer, entre otros, los derechos y obligaciones de las partes, las causales de terminación y las condiciones para su renovación. Serán parte integrante del contrato, el proyecto educativo institucional y el reglamento interno o manual de convivencia del establecimiento educativo. En ningún caso este contrato podrá incluir condiciones que violen los derechos fundamentales de los educandos, de los padres de familia, de los establecimientos educativos o de las personas naturales o jurídicas propietarias de los mismos."},{"s":"9.2. Proceso de Admisión","p":54,"t":"Se entiende la admisión como el acto por medio del cual se recibe al estudiante y a su acudiente, con el fin de adelantar el proceso de ingreso a la Institución y que podría culminar, previo el cumplimiento de los requisitos establecidos en este manual de convivencia, en la suscripción de la matrícula. Para realizar este proceso la institución LICEO PAOLA ha delegado a los miembros de la administración, los cuales, son los encargados de aplicar los protocolos (valoración con docente orientadora y coordinadora), realizar todo lo pertinente con la selección de los estudiantes que se admitirán para el año lectivo correspondiente."},{"s":"9.3. De los requisitos para la admisión","p":55,"t":"Como parte del proceso de admisión, el aspirante y sus acudientes deben cumplir con el protocolo definido por la institución, lo que conlleva: • Diligenciar el formato de inscripción en las fechas establecidas. • Asistir a la entrevista con la psico-orientadora, valoración académica (para los estudiantes nuevos.) • Presentar el informe académico correspondiente al último año escolar cursado y la documentación solicitada."},{"s":"9.4. Criterios para otorgar el cupo escolar y recibir a un estudiante","p":55,"t":"Para recibir a un estudiante en la Institución Educativa LICEO PAOLA, se han establecido unos criterios con orden de prioridades para la asignación de los cupos escolares, como son: • Demostrar la aprobación del último año lectivo cursado con un desempeño académico significativo (con un mínimo de 3,8 en nuestra escala de valoración) y con excelente comportamiento. • Estar dispuesto a hacer parte de esta comunidad y acoger los preceptos de la educación en actitudes valores encaminadas en la búsqueda del conocimiento, siempre respetando y enalteciendo la existencia de un ser superior. • Haber cumplido con el proceso de admisión establecido para esta finalidad."},{"s":"9.5. De los requisitos para la formalización de la matrícula","p":55,"t":"Son requisitos para la formalización de la matrícula: • Haber aprobado el proceso de admisión y ser admitido. • Fotocopia del documento de identidad. • Fotocopia del carnet de vacunación. • Fotocopia de la tarjeta de identidad. • Certificado médico. • Presentar Paz y Salvo por todo concepto emitido por la Institución de la cual proviene. • Certificaciones de notas del año inmediatamente anterior con un promedio de 3,8 (para estudiantes nuevos). • Firma de la ficha de matrícula, contrato de matrícula, pagare y la aceptación del Manual de Convivencia."},{"s":"9.6. Cancelación voluntaria de la matrícula","p":56,"t":"Cuando los padres de familia retiren de propia voluntad al estudiante, deberá cumplir con el siguiente protocolo: • Informar a la institución, por escrito, la causal o motivación del retiro. • Estar a Paz y Salvo con la Institución Educativa por todo concepto. • Firmar el acta de cancelación de matrícula. • Desvincular al estudiante de la plataforma de matrícula; este paso, le corresponde a la institución LICEO PAOLA, y solo se realizará cuando se hayan cumplido los pasos anteriores."},{"s":"10. ESTAMENTOS DE PARTICIPACIÓN DEMOCRÁTICA DE LA COMUNIDAD EDUCATIVA","p":56,"t":"DEL LICEO PAOLA. 10.1. Comunidad educativa de la Institución LICEO PAOLA. La comunidad educativa está constituida por todas las personas que tienen responsabilidades directas en la organización, desarrollo y evaluación del proyecto educativo institucional - PEI que se ejecuta en la institución educativa, tal como lo establece el Art. 18 del Decreto 1860/1994 y en consonancia con el Art. 6 de la Ley 115/1994, y el Art. 68 de la Constitución Política de Colombia. Por tanto, la comunidad educativa la componen los siguientes estamentos: • Los estudiantes que se han matriculado. • Los padres y madres, acudientes o en su defecto, los responsables de la educación de los alumnos matriculados. • Los docentes vinculados que laboren en la institución. • Los directivos docentes y administradores escolares que cumplen funciones directas en la prestación del servicio educativo. • Los egresados organizados para participar."},{"s":"10. ESTAMENTOS DE PARTICIPACIÓN DEMOCRÁTICA DE LA COMUNIDAD EDUCATIVA","p":56,"t":"Acorde con el Art. 6 de la Ley 115/1994, todos los miembros de la comunidad educativa, según su competencia, tienen el derecho de participar en el diseño, ejecución y evaluación del Proyecto Educativo Institucional y en la buena marcha del respectivo establecimiento educativo."},{"s":"10.2. Órganos del gobierno escolar de la Institución LICEO PAOLA","p":57,"t":"Cada establecimiento educativo tendrá un gobierno escolar en los términos establecidos en el Art. 68 de la Constitución Política de Colombia, el Art. 142 de la Ley 115/1994 y el Art. 20 del Decreto 1860/1994. Acorde con el Art. 142 Ley 115/1994 “Las instituciones educativas privadas establecerán en su reglamento, un gobierno escolar para la participación de la comunidad educativa a que hace referencia el Art. 68 de la Constitución Política Colombiana. En el gobierno escolar serán consideradas las iniciativas de los estudiantes, de los educadores, de los administradores y de los padres de familia en aspectos tales como la adopción y verificación del reglamento escolar, la organización de las actividades sociales, deportivas, culturales, artísticas y comunitarias, la conformación de organizaciones juveniles y demás acciones que redunden en la práctica de la participación democrática en la vida escolar. Los voceros de los estamentos constitutivos de la comunidad educativa, podrán presentar sugerencias para la toma de decisiones de carácter financiero, administrativo y técnico-pedagógico. Tanto en las instituciones educativas públicas como privadas, la comunidad educativa debe ser informada para permitir una participación seria y responsable en la dirección de las mismas”."},{"s":"10.2. Órganos del gobierno escolar de la Institución LICEO PAOLA","p":57,"t":"Los representantes de los órganos colegiados definidos en el gobierno escolar de la Institución Educativa serán elegidos para períodos anuales, y podrán ser reelegidos hasta por un periodo opcional en los casos que así lo permitan o la normatividad vigente no les sea contraria, pero continuarán ejerciendo sus funciones hasta cuando sean reemplazados. En caso de vacancia, se elegirá su reemplazo para el resto del período siguiendo el protocolo establecido para tal fin. Son órganos de participación democrática de la comunidad educativa de la Institución Educativa LICEO PAOLA, los siguientes: • El Consejo Directivo, como instancia directiva, de participación de la comunidad educativa y de orientación académica y administrativa del establecimiento. • El Rector (a), como representante del establecimiento ante las autoridades educativas y ejecutor de las decisiones del gobierno escolar. • El Consejo Académico, como instancia superior para participar en la orientación pedagógica del establecimiento."},{"s":"10.2. Órganos del gobierno escolar de la Institución LICEO PAOLA","p":57,"t":"• El Consejo Estudiantil, como órgano encargado de escoger al representante de la comunidad estudiantil ante el consejo directivo de la institución. • El Personero Estudiantil, encargado de promover el ejercicio de los derechos de los estudiantes consagrados en la Constitución Política, las leyes, los reglamentos y el manual de convivencia. 10.2.1. Consejo Directivo de la Institución Educativa LICEO PAOLA. Es el máximo órgano de dirección institucional, tiene carácter decisorio, de apoyo, asesor y consultor sobre la realidad y la gestión de los procesos institucionales. Su misión es velar por una mayor cualificación, desarrollo, ampliación e impacto social de la Institución, en asuntos administrativos y de orientación académica, darse su propio reglamento y establecer la frecuencia de reuniones ordinarias, acorde con lo dispuesto en el Art. 143 de la Ley 115/1994 y el Art. 21 del Decreto 1860/1994; acorde con el Art. 30 del Decreto 1860/1994, el Consejo Directivo promoverá la constitución de una asociación de padres de familia, y su respectivo consejo de padres, para lo cual podrá citar a una asamblea constitutiva, suministrar espacio o ayudas de secretaría, contribuir en el recaudo de cuotas de sostenimiento o apoyar iniciativas existentes."},{"s":"10.2. Órganos del gobierno escolar de la Institución LICEO PAOLA","p":58,"t":"El Consejo Directivo estará integrado por: • El Rector, quien convocará y presidirá las reuniones de este Consejo Directivo. • Dos representantes del personal Docente o un suplente, elegidos por mayoría de votos en Consejo Académico. • Dos representantes de los padres de Familia, uno el Presidente de la Asociación de padres de Familia o su suplente, y el otro elegido en asamblea general de padres de familia, elegidos por mayoría de votos entre los representantes a consejo de padres donde están representados tanto la sección de preescolar, primaria como secundaria. • El Representante de los estudiantes que debe estar cursando uno de los dos últimos cursos que ofrece la Institución o su suplente. Acorde con el Art. 23 del Decreto 1860/1994, el Art. 142 inciso 3 y el Art. 144 de la Ley 115/1994, son funciones del Consejo Directivo: • Tomar las decisiones que afecten el funcionamiento de la institución, excepto las que sean competencia de otra autoridad, tales como las reservadas a la dirección administrativa."},{"s":"10.2. Órganos del gobierno escolar de la Institución LICEO PAOLA","p":58,"t":"• Servir de instancia para resolver los conflictos que se presenten entre docente y administrativos con los estudiantes después de haber agotado los procedimientos previstos en el reglamento o manual de convivencia. • Adoptar el Manual de Convivencia. • Asumir la defensa y garantía de los derechos de toda la comunidad educativa, cuando alguno de sus miembros se sienta lesionado. • Promover el proceso continuo de mejoramiento de la calidad de la educación de la Institución Educativa LICEO PAOLA. • Mantener activas las relaciones con las autoridades educativas, con los patrocinadores o auspiciadores de la institución y con la comunidad local. • Establecer estímulos para el buen desempeño académico y social del estudiante y sanciones por la violación del Manual de Convivencia. Estos han de incorporarse al reglamento o manual de convivencia. En ningún caso pueden ser contrarios a la dignidad del estudiante."},{"s":"10.2. Órganos del gobierno escolar de la Institución LICEO PAOLA","p":59,"t":"• Recomendar criterios de participación de la institución en actividades comunitarias, culturales, deportivas y recreativas. • Promover las relaciones de tipo académico, deportivo, cultural con otras instituciones educativas y la conformación de organizaciones juveniles. • Fomentar la conformación de la asociación de Padres de Familia y de Estudiantes. • Reglamentar los procesos electorales. • Darse su propio reglamento. • Aprobar los costos educativos anuales • Deliberar sobre la admisión y permanencia de miembros de la comunidad educativa en casos especiales. • Garantizar el cumplimiento de las acciones necesarias para la implementación de los aspectos relacionados con la institución, que son de obligatorio cumplimiento, en marco de la Ley 1620/2013 y el Art. 22 del Decreto 1965/2013. 10.2.2. Rector (a) de la Institución Educativa LICEO PAOLA. El rector (a) de la Institución Educativa LICEO PAOLA es el representante de la Institución ante la Secretaría de Educación y en todo lo referente o legal. Es el responsable de definir el rumbo de la institución y de que se establezcan políticas y lineamientos de trabajo pertinentes para la ejecución del proyecto educativo institucional, de la planeación, la dirección y la supervisión general de las actividades necesarias para la prestación del servicio educativo, incluidas las administrativas y financieras. Su responsabilidad está altamente comprometida con la misión, visión y políticas de la Institución y en procura de los más altos niveles de calidad y las demandadas en el manual de responsabilidad, autoridad y funciones del Sistema de Gestión de Calidad Institucional."},{"s":"10.2. Órganos del gobierno escolar de la Institución LICEO PAOLA","p":59,"t":"El Artículo 25 del Decreto 1860/94, establece que son funciones del rector: • Dirigir la institución en los aspectos pedagógicos, académicos, formativos, disciplinarios, administrativos y económicos y representarla ante los distintos estamentos que así lo requieran. • Adoptar y dar a conocer los reglamentos y el manual de convivencia del plantel a todos los integrantes de la comunidad educativa. • Distribuir o asignar nuevas funciones a todo el personal, al servicio de la institución. • Convocar, orientar y presidir o delegar a quien corresponda los distintos comités y consejos que funcionan en el colegio, ejecutando las decisiones que se tomen en los mismos. • Convocar a los padres de familia para la elección de sus representantes al consejo directivo, verificando su condición de padres de familia de la institución y que en caso de reelección de un miembro ésta solo se haga por un periodo adicional."},{"s":"10.2. Órganos del gobierno escolar de la Institución LICEO PAOLA","p":59,"t":"• Delegar bajo su responsabilidad, las funciones que considere necesarias en los demás agentes educativos. • Promover el proceso continuo de mejoramiento de la calidad de la educación en la institución. • Orientar la ejecución del PEI y aplicar las decisiones del gobierno escolar. • Autorizar utilización de la planta física y cualquier clase de reunión que pretenda realizarse en el plantel. • Evaluar y controlar los servicios de todos los agentes educativos de la institución; proponer los estímulos necesarios y aplicar las sanciones a que haya lugar. • Aplicar las leyes, decretos, resoluciones y disposiciones expedidos por el Estado o autoridades educativas legítimas, atinentes a la prestación del servicio de la educación. • Actuar de conformidad con lo establecido en lo establecido en la Ley 1620/2013 y su reglamentario Decreto 1965/2013. En la elaboración del reglamento del Consejo Directivo de la Institución Educativa LICEO PAOLA, se consideran que:"},{"s":"10.2. Órganos del gobierno escolar de la Institución LICEO PAOLA","p":60,"t":"• Se elegirá dentro de los primeros treinta días del año lectivo a los dos representantes de los padres de familia en el consejo directivo del establecimiento educativo, en reunión de padres de familia convocada por el rector. • Los docentes, directivos o administrativos no podrán ser representantes de los padres de familia en el consejo directivo del mismo establecimiento en que laboran. 10.2.3. Consejo Académico de la Institución Educativa LICEO PAOLA. Para dar cumplimiento a lo dispuesto en el Art. 145 de la Ley 115/1994 y al Art. 24 del Decreto 1860/1994, el Consejo Académico de la Institución Educativa LICEO PAOLA, estará conformado por: • El Rector (a), quien lo convocará y presidirá. • Todos los directivos Docentes (cuando existan en la institución o hagan funciones propias de ellos). • Todos los docentes que laboren en la institución. • Todos los profesionales de apoyo que laboren en la institución."},{"s":"10.2. Órganos del gobierno escolar de la Institución LICEO PAOLA","p":60,"t":"El consejo académico cumplirá con las siguientes funciones y sus decisiones se aprobarán por mayoría simple, teniendo que deberá: • Servir de órgano consultor del Consejo Directivo en la revisión del Proyecto Educativo Institucional. • Estudiar el currículo y propiciar ajustes para su continuo mejoramiento. • Organizar el plan de estudios y orientar su ejecución. • Participar en los procesos de la evaluación de la gestión institucional • Orientar la revisión continua del rendimiento de los estudiantes y el proceso de evaluación institucional. • Proponer las modificaciones necesarias y pertinentes al sistema institucional de evaluación de los aprendizajes y promoción de los estudiantes. • Recibir, analizar y decidir sobre los reclamos de estudiantes en relación con la evaluación académica. • Analizar y conceptuar sobre el proceso de promoción de los estudiantes de la institución. • Servir de instancia de apelación en los procesos que por correctivos académicos se le asigne en el presente manual."},{"s":"10.2. Órganos del gobierno escolar de la Institución LICEO PAOLA","p":61,"t":"• Otras funciones afines o complementarias con las anteriores que le atribuyan el proyecto educativo institucional. 10.2.4. Consejo de Estudiantes de la Institución LICEO PAOLA. Decreto 1860. Art. 29 del. En todas las instituciones educativas funcionará un Consejo Estudiantil que asegure y garantice el continuo ejercicio de la participación por parte de los educandos. Es un organismo constituido por un vocero de cada grado. El Consejo Directivo deberá convocar en una fecha dentro de las cuatro primeras semanas del calendario académico, las elecciones integradas por los alumnos que cursen cada grado, con el fin de que elijan de su seno mediante votación secreta, un vocero estudiantil para el año lectivo en curso, esta actividad debe estar acompañada y supervisada por cada titular de grupo. • Son funciones del consejo estudiantil: a. Darse su propia organización interna. b. Elegir el representante de los estudiantes ante el consejo directivo del establecimiento y asesorarlo en el cumplimiento de su representación."},{"s":"10.2. Órganos del gobierno escolar de la Institución LICEO PAOLA","p":61,"t":"c. Ser motivador de los estudiantes hacia la búsqueda del mejoramiento de su calidad académica, sus niveles de desempeño y su comportamiento. d. Invitar a sus deliberaciones aquellos estudiantes que presentan iniciativas sobre el desarrollo de la vida estudiantil. e. Preocuparse por el conocimiento, vivencia, difusión y práctica del proyecto educativo institucional. f. Acompañar al personero en la ejecución de su plan trabajo presentado en la campaña para su elección."},{"s":"10.2.5. Personero Estudiantil de la Institución LICEO PAOLA","p":61,"t":"La normatividad establecida en el Art. 28 del Decreto 1860/1994 determina que en todas las instituciones educativas debe nombrarse un personero estudiantil, quien será elegido, por votación secreta y por mayoría simple, entre los estudiantes matriculados en el último grado de escolaridad que ofrezca la Institución. Esta elección debe realizarse dentro de los treinta días calendario siguiente al de la iniciación de clases de un período lectivo anual. El ejercicio del cargo de personero de los estudiantes es incompatible con el de representante de los estudiantes ante el Consejo Directivo. • Son funciones del personero: a. Promover el cumplimiento de los derechos y deberes de los estudiantes, consignados en el Manual de Convivencia, para lo cual podrá utilizar los medios de comunicación interna del establecimiento, pedir la colaboración del consejo de estudiantes, organizar foros u otras formas de deliberación."},{"s":"10.2.5. Personero Estudiantil de la Institución LICEO PAOLA","p":62,"t":"b. Recibir y evaluar las quejas y reclamos que presenten los educandos sobre lesiones a sus derechos y las que formule cualquier persona de la comunidad sobre el incumplimiento de las obligaciones de los alumnos. c. Presentar ante las instancias correspondientes, solicitudes, quejas, propuestas o reclamos que le presenten los estudiantes, buscando así proteger sus deberes y derechos. d. Cuando lo considere necesario, apelar ante el Consejo Directivo o el organismo que haga sus veces, las decisiones del rector respecto a las peticiones presentadas por su intermedio. e. Ser vocero de los estudiantes frente a las instancias superiores de la institución, en casos donde estas presentes inquietudes generalizadas o cuando haya diferentes procesos cuyas implicaciones afecten a los estudiantes. f. Presentar conjuntamente con el Consejo Estudiantil, propuestas que propendan al mejoramiento institucional."},{"s":"10.2.5. Personero Estudiantil de la Institución LICEO PAOLA","p":62,"t":"g. Hacer parte del comité de convivencia escolar acorde con lo contemplado en el Art. 12 de la Ley 1620/2013."},{"s":"11.1. Objetivo del Comité Escolar de Convivencia","p":62,"t":"Todas las instituciones educativas y centros educativos oficiales y no oficiales del país deberán conformar el comité escolar de convivencia, el cual: a. Será el encargado de apoyar la labor de promoción y seguimiento a la convivencia escolar, a la educación para el ejercicio de los derechos humanos, sexuales y reproductivos, así como del desarrollo y aplicación del manual de convivencia y de la prevención y mitigación de la violencia escolar, tal como está contemplado en el Art. 22 del Decreto 1965/2013. b. Deberá identificar nuevas formas y alternativas para incentivar y fortalecer la convivencia escolar y el ejercicio de los derechos humanos, sexuales y reproductivos de los estudiantes, que permitan aprender del error, respetar la diversidad y dirimir los conflictos de manera pacífica, así como de posibles situaciones y conductas que atenten contra el ejercicio de sus derechos, como lo establece el Art. 22 de la Ley 1620/2013."},{"s":"11.2.1. De la conformación e instalación del Comité Escolar de","p":63,"t":"Convivencia De acuerdo con el Art. 22 del Decreto 1965/2013 y en consonancia con lo dispuesto en el Art. 12 de la Ley 1620/2013, el Comité Escolar de Convivencia estará conformado por: • El Rector (a), como su presidente y quien lo presidirá • El personero estudiantil • El docente con función de orientación • El coordinador cuando exista este cargo • El presidente del consejo de padres de familia • Un (1) docente que lidere procesos o estrategias de convivencia escolar. Nota: El gobierno escolar de la Institución Educativa LICEO PAOLA se ha definido con base en el Art. 19 y 20 del Decreto 1860/1994 y el Art. 142 de la Ley 115/1994; por ello, el padre de familia que hará parte del comité escolar de convivencia, que determina el Art. 22 del Decreto 1965/2013, será escogido en reunión general de padres de familia."},{"s":"11.2.2. Derecho a la intimidad y confidencialidad del Comité Escolar de","p":63,"t":"Convivencia El Art. 25 del Decreto 1965/2013, enfatiza que el comité escolar de convivencia deberá garantizar el derecho a la intimidad y a la confidencialidad de los datos personales que sean tratados en el marco de las actuaciones que éste adelante, conforme a lo dispuesto en la Constitución Política, los tratados internacionales, en la Ley 1098 de 2006, en la Ley estatutaria 1581 de 2012, en el Decreto 1377 de 2013 y demás normas aplicables a la materia. Una vez elegidos los miembros del Comité, se procederá a su instalación formal, de la que se dejará constancia en un acta, teniendo en cuenta los siguientes puntos: • Nombramiento del presidente y designación del secretario del Comité por mutuo acuerdo entre sus miembros. • Hacer juramento de compromiso de confidencialidad."},{"s":"11.2.3. Funciones del Comité Escolar de Convivencia","p":63,"t":"De acuerdo con lo establecido en el Art. 13 de la Ley 1260/2013, serán funciones del comité escolar de convivencia: a. Identificar, documentar, analizar y resolver los conflictos que se presenten entre docentes y estudiantes, directivos y estudiantes, entre estudiantes y entre docentes. b. Liderar en los establecimientos educativos acciones que fomenten la convivencia, la construcción de ciudadanía, el ejercicio de los derechos humanos, sexuales y reproductivos y la prevención y mitigación de la violencia escolar entre los miembros de la comunidad educativa. c. Promover la vinculación de los establecimientos educativos a estrategias, programas y actividades de convivencia y construcción de ciudadanía que se adelanten en la región y que respondan a las necesidades de su comunidad educativa. d. Convocar a un espacio de conciliación para la resolución de situaciones conflictivas que afecten la convivencia escolar, por solicitud de cualquiera de los miembros de la comunidad educativa o de oficio cuando se estime conveniente en procura de evitar perjuicios irremediables a los miembros de la comunidad educativa. El estudiante estará acompañado por el padre, madre de familia, acudiente o un compañero del establecimiento educativo."},{"s":"11.2.3. Funciones del Comité Escolar de Convivencia","p":64,"t":"e. Activar la Ruta de Atención Integral para la Convivencia Escolar frente a situaciones específicas de conflicto, de acoso escolar, frente a las conductas de alto riesgo de violencia escolar o de vulneración de derechos sexuales y reproductivos que no pueden ser resueltos por este comité de acuerdo con lo establecido en el manual de convivencia, porque trascienden del ámbito escolar, y revisten las características de la comisión de una conducta punible, razón por la cual deben ser atendidos por otras instancias o autoridades que hacen parte de la estructura del Sistema y de la Ruta. f. Liderar el desarrollo de estrategias e instrumentos destinados a promover y evaluar la convivencia escolar, el ejercicio de los derechos humanos, sexuales y reproductivos. g. Hacer seguimiento al cumplimiento de las disposiciones establecidas en el manual de convivencia, y presentar informes a la respectiva instancia que hace parte de la estructura del Sistema Nacional de Convivencia Escolar y Formación para los Derechos Humanos, la Educación para la Sexualidad y la Prevención y Mitigación de la Violencia Escolar, de los casos o situaciones que haya conocido el comité."},{"s":"11.2.3. Funciones del Comité Escolar de Convivencia","p":64,"t":"h. Proponer, analizar y viabilizar estrategias pedagógicas que permitan la flexibilización del modelo pedagógico y la articulación de diferentes áreas de estudio que lean el contexto educativo y su pertinencia en la comunidad para determinar más y mejores maneras de relacionarse en la construcción de la ciudadanía. i. Elaborar su propio reglamento, el cual debe abarcar lo correspondiente a sesiones, y demás aspectos procedimentales, como aquellos relacionados con la elección y permanencia en el comité del docente que lidere procesos o estrategias de convivencia escolar. j. Invitar con voz pero sin voto a un miembro de la comunidad educativa conocedor de los hechos, con el propósito de ampliar información, cuando así lo considere. k. En caso de diferencias irreconciliables, posturas intolerantes o falta de acuerdo entre los miembros del comité, se podrá (n) invitar algún (os) participante (s) que tendrá (n) voz y no voto y que participará (n) de mediador (es) y en beneficio de la solución del problema."},{"s":"11.2.3. Funciones del Comité Escolar de Convivencia","p":64,"t":"l. Otras que disponga la normatividad legal vigente."},{"s":"11.2.4. Operatividad del Comité Escolar de Convivencia","p":65,"t":"En marco del desarrollo y aplicación del manual de convivencia y de la prevención y mitigación de la violencia escolar, el comité de convivencia escolar, éste deberá tener en cuenta: a. De las sesiones del Comité Escolar de Convivencia. De acuerdo con el Decreto 1965. Art. 23 el comité escolar de convivencia de la Institución se reunirá ordinariamente cada dos (2) meses contados a partir del inicio del año lectivo escolar, para lo cual se elaborará el respectivo cronograma. b. Las sesiones extraordinarias serán convocadas por el presidente del comité escolar de convivencia, cuando las circunstancias lo exijan o · por solicitud de cualquiera de sus integrantes. c. Del quorum decisorio del Comité Escolar de Convivencia. De acuerdo al Decreto 1965. Art. 24. Para que exista quorum decisorio deberán estar presentes tres (3) miembros del comité escolar de convivencia, como mínimo. El comité escolar de convivencia no podrá sesionar sin la presencia del Rector (a), debido a que éste es quien lo preside."},{"s":"11.2.4. Operatividad del Comité Escolar de Convivencia","p":65,"t":"d. De las actas de reuniones del Comité Escolar de Convivencia. Acorde a lo establecido en el Decreto 1965. Art. 25 y el Art. 10 del Decreto 1965/2013, de cada una de sus sesiones se elaborará un acta, la cual deberá contener como mínimo los siguientes requisitos: • Lugar, fecha y hora de la reunión. • Registro de los miembros del Comité que asistieron a la sesión, para efectos de verificación del quórum. • Registro de los miembros del Comité que presentaron excusa debidamente justificada para no asistir a la sesión. • Indicación de los medios utilizados para comunicar la citación a los miembros del Comité. • Síntesis de los temas tratados en la reunión, así co
